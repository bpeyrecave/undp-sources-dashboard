<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNDP Photo &amp; Story Sources</title>
<style>
:root{
  --navy:#232E3D;--blue:#006EB5;--red:#EE402D;
  --gray-bg:#F5F5F5;--gray-section:#EDEFF0;--gray-mid:#A9B1B7;--gray-dark:#55606E;
  --white:#fff;--black:#000;
  --font:proxima-nova,'Proxima Nova','Arial Nova',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;background:var(--gray-bg);color:var(--navy)}
a{color:inherit;text-decoration:none}

/* ── Header ── */
header{
  background:var(--navy);color:var(--white);
  padding:18px 32px;
  display:flex;align-items:center;justify-content:space-between;
}
header h1{font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
header .logo{font-size:16px;font-weight:900;letter-spacing:.12em}

/* ── Controls ── */
.controls{
  background:var(--white);padding:16px 32px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid #E0E0E0;
}
.search-wrap{position:relative;flex:0 0 260px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-dark);fill:none;stroke-width:2}
.search-wrap input{
  width:100%;border:1.5px solid var(--navy);padding:8px 10px 8px 34px;
  font-size:13px;font-family:var(--font);color:var(--navy);background:var(--white);outline:none;
}
.search-wrap input::placeholder{color:var(--gray-mid)}
.search-wrap input:focus{border-color:var(--blue)}

.filter-select{
  position:relative;flex:0 0 200px;
}
.filter-select select{
  width:100%;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--navy);padding:8px 36px 8px 12px;
  font-size:13px;font-family:var(--font);font-weight:600;
  color:var(--navy);background:var(--white);cursor:pointer;outline:none;
  text-transform:uppercase;letter-spacing:.05em;
}
.filter-select select:focus{border-color:var(--blue)}
.filter-select .chev{
  pointer-events:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;
}
.count{margin-left:auto;font-size:12px;color:var(--gray-dark)}

/* ── Table wrapper ── */
.table-wrap{padding:0 32px 48px;overflow-x:auto}

table{
  width:100%;border-collapse:collapse;background:var(--white);
  font-size:13px;min-width:760px;
  border:1px solid #E0E0E0;
}

/* ── Column headers ── */
thead tr{background:var(--navy)}
th{
  padding:10px 16px;text-align:left;
  font-weight:700;font-size:12px;color:var(--white);
  text-transform:none;letter-spacing:.01em;
  white-space:nowrap;user-select:none;
  border-right:1px solid rgba(255,255,255,.08);
}
th:last-child{border-right:none}
th .th-inner{display:flex;align-items:center;gap:6px;cursor:pointer}
th .th-inner:hover{opacity:.8}
.sort-btn{
  background:none;border:none;cursor:pointer;padding:0;
  display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.sort-btn svg{width:10px;height:10px;fill:rgba(255,255,255,.4)}
.sort-btn.asc svg.up{fill:#fff}
.sort-btn.desc svg.dn{fill:#fff}

/* Chevron sort buttons for date columns */
.az-btn{
  background:none;border:none;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.az-btn svg{
  width:16px;height:16px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:2.5;
  transition:transform .2s, stroke .2s;
}
.az-btn.asc svg{ stroke:#fff; transform:rotate(0deg); }
.az-btn.desc svg{ stroke:#fff; transform:rotate(180deg); }

/* ── Section rows ── */
tr.sec-row td{
  background:var(--gray-section);
  padding:8px 16px;border-bottom:1px solid #E0E0E0;border-top:2px solid #D0D4D8;
}
.sec-inner{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.sec-inner.co{color:var(--blue)}
.sec-inner.regional{color:var(--gray-dark)}
.sec-chevron{
  width:16px;height:16px;flex-shrink:0;transition:transform .2s;
  stroke:currentColor;fill:none;stroke-width:2.5;
}
.sec-chevron.open{transform:rotate(0deg)}
.sec-chevron.closed{transform:rotate(-90deg)}

/* ── Section sort button (A→Z icon) ── */
.sec-sort-btn{
  display:inline-flex;align-items:center;
  margin-left:8px;cursor:pointer;opacity:.55;
  transition:opacity .15s;flex-shrink:0;
}
.sec-sort-btn:hover{opacity:1}
.sec-sort-icon{
  width:18px;height:18px;color:currentColor;
  flex-shrink:0;
}

/* ── Data rows ── */
td{
  padding:11px 16px;border-bottom:1px solid #F0F0F0;
  vertical-align:middle;
}
tr.hidden{display:none}
tr:not(.sec-row):hover td{background:#F7F9FC}
.cname{font-size:13px;font-weight:400;color:var(--navy)}

/* ── Platform cell ── */
.pcell{display:flex;align-items:center;gap:6px;white-space:nowrap}
.date-txt{font-size:13px;color:var(--navy)}
.ext-link{
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ext-link svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2}
.ext-link:hover svg{stroke:#c0301f}

/* "Inexistent" pill */
.inexistent{
  display:inline-flex;align-items:center;gap:5px;
  background:#EDEFF0;border:1px solid #C4C9CE;border-radius:20px;
  padding:3px 10px;font-size:12px;color:var(--gray-dark);
  white-space:nowrap;
}
.inexistent svg{width:10px;height:10px;stroke:var(--gray-dark);fill:none;stroke-width:2.5}

.nodata-row td{text-align:center;padding:48px;color:var(--gray-dark);font-style:italic}

/* ── Header nav ── */
.header-nav{display:flex;align-items:center;gap:12px}
.header-nav-item{
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.5);cursor:pointer;
  padding-bottom:2px;border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s;
}
.header-nav-item:hover{color:rgba(255,255,255,.85)}
.header-nav-item.active{color:#fff;border-bottom-color:#fff}
.header-nav-sep{color:rgba(255,255,255,.25);font-size:13px;user-select:none}

/* ── Gallery sort control ── */
.gallery-sort{
  position:relative;flex:0 0 180px;display:none;
}
.gallery-sort.visible{display:block}
.gallery-sort select{
  width:100%;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--navy);padding:8px 36px 8px 12px;
  font-size:13px;font-family:var(--font);font-weight:600;
  color:var(--navy);background:var(--white);cursor:pointer;outline:none;
  text-transform:uppercase;letter-spacing:.05em;
}
.gallery-sort select:focus{border-color:var(--blue)}
.gallery-sort .chev{
  pointer-events:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;
}

/* ── Gallery grid ── */
.gallery-wrap{
  display:none;padding:24px 32px 48px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}
.gallery-wrap.visible{display:grid}

/* ── Gallery card ── */
.gcard{
  background:var(--white);
  border:1px solid #E0E0E0;
  box-shadow:0 2px 4px rgba(16,24,40,.03);
  display:flex;flex-direction:column;
  transition:box-shadow .15s,transform .15s;
  cursor:pointer;text-decoration:none;color:inherit;
}
.gcard:hover{box-shadow:0 6px 20px rgba(16,24,40,.1);transform:translateY(-2px)}
.gcard-img{
  width:100%;aspect-ratio:16/10;overflow:hidden;
  background:#EDEFF0;flex-shrink:0;position:relative;
}
.gcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.gcard-img .img-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#EDEFF0;
}
.gcard-img .img-loading{
  width:100%;height:100%;
  background:linear-gradient(90deg,#EDEFF0 25%,#E0E3E5 50%,#EDEFF0 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.gcard-img .img-placeholder svg{width:36px;height:36px;stroke:#C4C9CE;fill:none;stroke-width:1}
.gcard-body{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.gcard-meta{display:flex;flex-direction:column;gap:2px}
.gcard-meta-top{display:flex;align-items:center;gap:6px}
.gcard-flag{font-size:14px;line-height:1;flex-shrink:0}
.gcard-country{font-size:11px;font-weight:600;color:#677383;line-height:1.4}
.gcard-date{font-size:11px;font-weight:400;color:#677383;line-height:1.4}
.gcard-title-row{display:flex;gap:8px;align-items:flex-start}
.gcard-title{
  flex:1;font-size:14px;font-weight:600;color:#101828;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.gcard-ext{flex-shrink:0;margin-top:2px;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.gcard-album{font-size:11px;color:var(--gray-dark);font-weight:500;line-height:1.4;}
.gcard-flickr-meta{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.gcard-date-detail{font-size:10px;color:var(--gray-mid);line-height:1.3;}
.gcard-ext svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2}
/* Platform chip overlaid on image (top-left) */
.gcard-img-chip{
  position:absolute;top:10px;left:10px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(4px);
  border-radius:20px;padding:4px 10px 4px 8px;
  font-size:12px;font-weight:600;color:#333;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.flickr-dots{display:inline-flex;gap:3px;align-items:center}
.flickr-dot-blue{width:10px;height:10px;border-radius:50%;background:#0063DC}
.flickr-dot-pink{width:10px;height:10px;border-radius:50%;background:#FF0084}

/* ── Favourite star button (top-right of card image) ── */
.gcard-fav{
  position:absolute;top:10px;right:10px;z-index:3;
  width:32px;height:32px;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(4px);
  border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
  transition:transform .15s, background .15s;
  flex-shrink:0;
}
.gcard-fav:hover{transform:scale(1.12);background:#fff;}
.gcard-fav svg{width:16px;height:16px;transition:fill .15s,stroke .15s;}
.gcard-fav.faved svg{fill:#F5A623;stroke:#E09010;}
.gcard-fav:not(.faved) svg{fill:transparent;stroke:#555;stroke-width:2;}

/* ── Selected Photos empty state ── */
.selected-empty{
  grid-column:1/-1;padding:72px 32px;text-align:center;
  color:var(--gray-dark);
}
.selected-empty svg{width:48px;height:48px;stroke:#C4C9CE;fill:none;stroke-width:1.2;margin-bottom:16px;}
.selected-empty p{font-size:14px;line-height:1.6;}
.selected-empty strong{color:var(--navy);}

/* Browse hint overlay on hoverable album cards */
.gcard-img-browse-hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
  color:#fff;font-size:11px;font-weight:600;font-family:var(--font);
  border-radius:20px;padding:5px 14px;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  opacity:0;transition:opacity .18s;pointer-events:none;
}
.gcard-img-browse-hint svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.gcard-img-clickable:hover .gcard-img-browse-hint{opacity:1;}

/* Old bottom chip — keep for non-Flickr platforms */
.gcard-platform{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:400;font-family:var(--font);
  color:#677383;padding:3px 10px;border-radius:20px;
  background:#EDEFF0;box-shadow:0 0.5px 1px rgba(0,0,0,.2);
  align-self:flex-start;white-space:nowrap;
}
.gcard-subtitle{
  display:block;font-size:11px;color:#677383;
  line-height:1.4;margin-top:2px;margin-bottom:4px;
  font-style:italic;
}
.gallery-pager{
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:24px 0 32px;width:100%;
}
.pager-btn{
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--navy);background:#fff;border:1.5px solid #D0D5DD;
  border-radius:8px;padding:8px 18px;cursor:pointer;transition:all .15s;
}
.pager-btn:hover:not([disabled]){background:var(--navy);color:#fff;border-color:var(--navy);}
.pager-btn[disabled]{opacity:.35;cursor:default;}
.pager-info{font-size:12px;color:#677383;font-family:var(--font);}
.gcard-count{
  font-size:10px;font-weight:600;background:rgba(255,255,255,.25);
  border-radius:4px;padding:1px 5px;margin-left:4px;
}
.gallery-nodata{
  display:none;padding:48px;text-align:center;
  color:var(--gray-dark);font-style:italic;font-size:13px;
  grid-column:1/-1;
}
.gallery-nodata.visible{display:block}
/* ── Lightbox ──────────────────────────────────────────────────────────────── */
.lb-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.88);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.lb-overlay.open{opacity:1;pointer-events:all;}
.lb-box{
  position:relative;width:100%;max-width:1080px;height:100vh;
  display:flex;flex-direction:column;padding:0 64px;
  box-sizing:border-box;
}
/* Header row */
.lb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 14px;flex-shrink:0;
}
.lb-title-wrap{display:flex;flex-direction:column;gap:2px;}
.lb-album-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em;}
.lb-sub{font-size:11px;color:rgba(255,255,255,.5);}
.lb-close{
  background:none;border:none;cursor:pointer;padding:6px;
  color:rgba(255,255,255,.6);transition:color .15s;
}
.lb-close:hover{color:#fff;}
.lb-close svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
/* Main image area */
.lb-stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;min-height:0;
}
.lb-img-wrap{
  max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;
}
.lb-img-wrap img{
  max-width:100%;max-height:calc(100vh - 220px);
  object-fit:contain;display:block;
  border-radius:2px;
}
.lb-spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;
  animation:lb-spin .7s linear infinite;
}
@keyframes lb-spin{to{transform:rotate(360deg)}}
/* Arrows */
.lb-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);
  color:#fff;cursor:pointer;border-radius:50%;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  transition:background .15s;z-index:2;
}
.lb-arrow:hover{background:rgba(255,255,255,.22);}
.lb-arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;}
.lb-arrow.prev{left:-52px;}
.lb-arrow.next{right:-52px;}
.lb-arrow[disabled]{opacity:.25;cursor:default;pointer-events:none;}
/* Footer row */
.lb-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0 18px;flex-shrink:0;gap:12px;
}
.lb-counter{font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap;}
.lb-photo-info{font-size:11px;color:rgba(255,255,255,.45);flex:1;text-align:center;}
.lb-actions{display:flex;align-items:center;gap:10px;}
/* Star button inside lightbox */
.lb-star{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);
  color:#fff;border-radius:24px;padding:7px 16px;cursor:pointer;
  font-size:13px;font-weight:600;font-family:var(--font);
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.lb-star:hover{background:rgba(255,255,255,.18);}
.lb-star.faved{background:rgba(245,166,35,.18);border-color:#F5A623;color:#F5A623;}
.lb-star svg{width:15px;height:15px;fill:transparent;stroke:currentColor;stroke-width:2;transition:fill .15s,stroke .15s;}
.lb-star.faved svg{fill:#F5A623;stroke:#F5A623;}
/* Tag pill input area */
.lb-tags-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;}
.lb-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:3px 10px;font-size:11px;color:#fff;
  font-family:var(--font);
}
.lb-tag-del{
  background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;
  font-size:13px;line-height:1;padding:0 0 0 2px;
}
.lb-tag-del:hover{color:#fff;}
.lb-tag-input{
  background:none;border:none;outline:none;color:#fff;
  font-size:12px;font-family:var(--font);width:100px;
  border-bottom:1px solid rgba(255,255,255,.25);padding:2px 4px;
}
.lb-tag-input::placeholder{color:rgba(255,255,255,.3);}
/* Tag filter row in gallery controls */
.tag-filter-wrap{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 32px;background:#fff;border-bottom:1px solid #E0E0E0;}
.tag-filter-wrap.visible{display:flex;}
.tag-filter-label{font-size:11px;font-weight:700;color:var(--gray-dark);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.tag-chip{
  display:inline-flex;align-items:center;gap:4px;
  background:#EDEFF0;border:1.5px solid transparent;border-radius:20px;
  padding:3px 12px;font-size:12px;color:var(--navy);cursor:pointer;
  font-family:var(--font);transition:all .12s;
}
.tag-chip:hover{border-color:var(--blue);color:var(--blue);}
.tag-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
/* Individual fav cards in favs view */
.gcard-indiv-photo{
  font-size:10px;font-weight:600;color:var(--blue);
  letter-spacing:.04em;text-transform:uppercase;margin-top:4px;
}
.gcard-tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.gcard-tag{
  display:inline-block;background:#EEF4FB;border:1px solid #C8DCF5;
  border-radius:20px;padding:2px 9px;font-size:10px;color:var(--blue);
  font-family:var(--font);
}
</style>
</head>
<body>

<header>
  <div class="header-nav">
    <span class="header-nav-item active" id="nav-gallery" onclick="setView('gallery')" title="Photo Archive">Photo Archive</span>
    <span class="header-nav-sep">|</span>
    <span class="header-nav-item" id="nav-list" onclick="setView('list')" title="Editorial Archive">Editorial Archive</span>
  </div>
  <div class="logo">UNDP</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    <input type="text" id="q" placeholder="Search Office" oninput="galleryPage=0;currentView==='gallery'?renderGallery():render()">
  </div>

  <div class="filter-select">
    <select id="fSection" onchange="galleryPage=0;currentView==='gallery'?renderGallery():render()">
      <option value="">All Offices</option>
      <option value="co">Country Offices</option>
      <option value="bureau">Regional Bureaux</option>
      <option value="thematic">Thematic &amp; Programme</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#232E3D" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="filter-select">
    <select id="fPlatform" onchange="galleryPage=0;currentView==='gallery'?renderGallery():render()">
      <option value="">All Platforms</option>
      <option value="stories">Has Stories</option>
      <option value="blog">Has Blog</option>
      <option value="exposure">Has Exposure</option>
      <option value="flickr">Has Flickr</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#232E3D" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="gallery-sort" id="favFilterWrap">
    <select id="favFilter" onchange="galleryPage=0;renderGallery()">
      <option value="favs">⭐ Favourites</option>
      <option value="all">All Photos</option>
    </select>

let sortCol = 'country', sortDir = 1;
const collapsed = {co: false, bureau: false, thematic: false};
const sectionSort = {co: 1, bureau: 1, thematic: 1}; // 1 = A→Z, -1 = Z→A

function fmt(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-');
  return `${d||'01'}/${m}/${y}`;
}

function platformCell(p, fbUrl) {
  const url  = p?.url   || fbUrl || '';
  const date = p?.date  || null;
  const lu   = p?.latest_url || url;

  if (!url) {
    return `<td><span class="inexistent">${X_ICON} Inexistent</span></td>`;
  }
  const label = fmt(date);
  if (!label) {
    return `<td><div class="pcell"><span class="date-txt">—</span><a href="${url}" target="_blank" class="ext-link">${EXT_ICON}</a></div></td>`;
  }
  return `<td><div class="pcell"><span class="date-txt">${label}</span><a href="${lu}" target="_blank" class="ext-link">${EXT_ICON}</a></div></td>`;
}

function updateSortButtons() {
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.remove('asc','desc');
  });
  const id = 'sb-' + sortCol;
  const btn = document.getElementById(id);
  if (btn) btn.classList.add(sortDir === 1 ? 'asc' : 'desc');
}

function sort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  updateSortButtons();
  render();
}

function toggleSection(type) {
  collapsed[type] = !collapsed[type];
  render();
}

function toggleSectionSort(type, e) {
  e.stopPropagation();
  sectionSort[type] *= -1;
  render();
}

function merge(meta, json) {
  const map = {};
  if (json) json.forEach(o => { map[o.country] = o; });
  return meta.map(m => {
    const d = map[m.country] || {};
    return { ...m,
      flickr:         {url:m.flickrUrl,   date:d.flickr?.date||null,   latest_url:d.flickr?.latest_url||m.flickrUrl,   title:d.flickr?.title||null,   image_url:d.flickr?.image_url||null,   album:d.flickr?.album||null,   date_uploaded:d.flickr?.date_uploaded||null,   date_taken:d.flickr?.date_taken||null,   realname:d.flickr?.realname||null},
      flickr_archive: d.flickr_archive || null,   // full archive from scraper
      exposure:       {url:m.exposureUrl, date:d.exposure?.date||null, latest_url:d.exposure?.latest_url||m.exposureUrl, title:d.exposure?.title||null, subtitle:d.exposure?.subtitle||null, image_url:d.exposure?.image_url||null},
      stories:        {url:m.storiesUrl,  date:d.stories?.date||null,  latest_url:d.stories?.latest_url||m.storiesUrl,  title:d.stories?.title||null,  image_url:d.stories?.image_url||null},
      blog:           {url:m.blogUrl,     date:d.blog?.date||null,     latest_url:d.blog?.latest_url||m.blogUrl,        title:d.blog?.title||null,     image_url:d.blog?.image_url||null},
    };
  });
}

function render() {
  const q   = document.getElementById('q').value.toLowerCase();
  const fS  = document.getElementById('fSection').value;
  const fP  = document.getElementById('fPlatform').value;
  const isFiltering = q || fS || fP;

  let rows = DATA.filter(r => {
    if (q  && !r.country.toLowerCase().includes(q)) return false;
    if (fS && r.type !== fS)                         return false;
    if (fP === 'stories'  && !r.storiesUrl)          return false;
    if (fP === 'blog'     && !r.blogUrl)             return false;
    if (fP === 'exposure' && !r.exposureUrl)         return false;
    if (fP === 'flickr'   && !r.flickrUrl)           return false;
    return true;
  });

  

  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="nodata-row"><td colspan="5">No results match your filters.</td></tr>';
    return;
  }

  // Split rows into sections and sort each independently by country name
  const sections = [
    { type: 'co',       items: rows.filter(r => r.type === 'co') },
    { type: 'bureau',   items: rows.filter(r => r.type === 'bureau') },
    { type: 'thematic', items: rows.filter(r => r.type === 'thematic') },
  ].filter(s => s.items.length > 0);

  sections.forEach(s => {
    const dir = isFiltering ? 1 : sectionSort[s.type];
    s.items.sort((a, b) =>
      (a.country < b.country ? -1 : a.country > b.country ? 1 : 0) * dir
    );
  });

  let html = '';

  sections.forEach(s => {
    if (!isFiltering) {
      const isCollapsed = collapsed[s.type];
      const label = s.type === 'co' ? 'Country Offices'
        : s.type === 'bureau' ? 'Regional Bureaux'
        : 'Thematic &amp; Programme Accounts';
      const cls = s.type === 'co' ? 'co' : 'regional';
      const chevHtml = isCollapsed ? CHEV_CLOSE : CHEV_OPEN;
      const sd = sectionSort[s.type];
      const azLabel = sd === 1 ? 'A→Z' : 'Z→A';
      const sortChev = `<span class="sec-sort-btn" onclick="toggleSectionSort('${s.type}', event)" title="${sd === 1 ? 'A→Z — click for Z→A' : 'Z→A — click for A→Z'}">`
        + `<svg class="sec-sort-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">`
        + `<text x="1" y="8" font-size="6" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">A</text>`
        + `<text x="1" y="16" font-size="6" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">Z</text>`
        + `<polyline points="12,2 12,16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`
        + `<polyline points="${sd === 1 ? '8,12 12,16 16,12' : '8,6 12,2 16,6'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`
        + `</svg></span>`;
      html += `<tr class="sec-row">
        <td colspan="5">
          <div class="sec-inner ${cls}" onclick="toggleSection('${s.type}')">
            ${chevHtml}${label}${sortChev}
          </div>
        </td>
      </tr>`;
    }

    s.items.forEach(r => {
      const hide = (!isFiltering && collapsed[s.type]) ? ' class="hidden"' : '';
      html += `<tr${hide}>
        <td class="cname">${r.flickr?.realname || r.country}</td>
        ${platformCell(r.stories,  r.storiesUrl)}
        ${platformCell(r.blog,     r.blogUrl)}
        ${platformCell(r.exposure, r.exposureUrl)}
        ${platformCell(r.flickr,   r.flickrUrl)}
      </tr>`;
    });
  });

  tbody.innerHTML = html;
  updateSortButtons();
}

//   Individual Flickr photo: "photo|<photoUrl>"

//   Other platforms: "<platform>|<url>"

function _loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem('undp_favs_v2') || 'null');
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      return new Map(Object.entries(raw));
    }
  } catch(e) {}
  return new Map();
}

let FAVS = _loadFavs();

function saveFavs() {
  const obj = {};
  FAVS.forEach((v, k) => { obj[k] = v; });
  localStorage.setItem('undp_favs_v2', JSON.stringify(obj));
  updateTagFilterBar();
}

function favKey(c) {
  if (c.platform === 'flickr') {
    return c.album
      ? `flickr|${c.country}|album:${c.album}`
      : `flickr|${c.country}|date:${c.date}`;
  }
  return `${c.platform}|${c.url}`;
}

function photoFavKey(photoUrl) {
  return `photo|${photoUrl}`;
}

function isFaved(key) { return FAVS.has(key); }

function toggleFav(key, meta, btn) {
  if (FAVS.has(key)) {
    FAVS.delete(key);
    if (btn) { btn.classList.remove('faved'); btn.title = 'Add to Favourites'; }
  } else {
    FAVS.set(key, { key, ...meta, tags: [] });
    if (btn) { btn.classList.add('faved'); btn.title = 'Remove from Favourites'; }
  }
  saveFavs();
  if (currentView === 'gallery') renderGallery();
}

function addTagToFav(key, tag) {
  tag = tag.trim().toLowerCase();
  if (!tag) return;
  const fav = FAVS.get(key);
  if (!fav) return;
  if (!fav.tags.includes(tag)) fav.tags.push(tag);
  saveFavs();
}

function removeTagFromFav(key, tag) {
  const fav = FAVS.get(key);
  if (!fav) return;
  fav.tags = fav.tags.filter(t => t !== tag);
  saveFavs();
}

function allTags() {
  const tags = new Set();
  FAVS.forEach(f => f.tags?.forEach(t => tags.add(t)));
  return [...tags].sort();
}

// Proxy a URL through multiple CORS proxies with fallback
async function proxiedFetch(url, timeout = 12000) {
  const proxies = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
  ];
  for (const makeProxy of proxies) {
    try {
      const r = await fetch(makeProxy(url), { signal: AbortSignal.timeout(timeout) });
      if (r.ok) return r;
    } catch(e) {}
  }
  return null;
}

// Resolve a vanity Flickr name to numeric NSID via their lookup API (no auth needed)
async function resolveFlickrNsid(vanity) {
  if (/^\d+@N\d+$/.test(vanity)) return vanity; // already numeric
  try {
    // Flickr's public lookup URL embeds the NSID in the page source
    const r = await proxiedFetch(`https://www.flickr.com/people/${vanity}/`, 8000);
    if (!r) return vanity;
    const text = await r.text();
    const m = text.match(/"nsid"\s*:\s*"(\d+@N\d+)"/)
           || text.match(/data-track-nsid="(\d+@N\d+)"/)
           || text.match(/"person_id"\s*:\s*"(\d+@N\d+)"/);
    return m ? m[1] : vanity;
  } catch(e) {
    return vanity;
  }
}

async function fetchLightboxPhotos(card) {
  // Extract set ID and user ID from the card URL
  const albumUrlMatch = card.url && card.url.match(/flickr\.com\/photos\/([^/]+)\/(\d+)\/in\/album-(\d+)/);
  const albumPageMatch = card.url && card.url.match(/flickr\.com\/photos\/([^/]+)\/albums\/(\d+)/);
  const setId   = albumUrlMatch ? albumUrlMatch[3] : (albumPageMatch ? albumPageMatch[2] : null);
  const rawNsid = albumUrlMatch ? albumUrlMatch[1] : (albumPageMatch ? albumPageMatch[1] : null);

  // Strategy 1: photoset feed — needs numeric NSID, so resolve vanity names first
  if (setId && rawNsid) {
    try {
      const numericNsid = await resolveFlickrNsid(rawNsid);
      const feedUrl = `https://www.flickr.com/services/feeds/photoset.gne?set=${setId}&nsid=${encodeURIComponent(numericNsid)}&format=atom`;
      const r = await proxiedFetch(feedUrl);
      if (r) {
        const text = await r.text();
        const photos = parseFlickrFeedPhotos(text);
        if (photos.length) return photos;
      }
    } catch(e) {}
  }

  // Strategy 2: general public feed for this account
  const nsidFromUrl = nsidFromFlickrUrl(card.url || '') || rawNsid;
  if (nsidFromUrl) {
    try {
      const numericNsid = await resolveFlickrNsid(nsidFromUrl);
      const feedUrl = `https://www.flickr.com/services/feeds/photos_public.gne?id=${encodeURIComponent(numericNsid)}&format=atom`;
      const r = await proxiedFetch(feedUrl);
      if (r) {
        const text = await r.text();
        const photos = parseFlickrFeedPhotos(text);
        if (photos.length) return photos;
      }
    } catch(e) {}
  }

  // Last resort: show just the cover photo
  if (card.image_url) {
    return [{ url: card.url, image_url: card.image_url, title: card.title || '', date: card.date }];
  }
  return [];
}

function parseFlickrFeedPhotos(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const entries = Array.from(doc.querySelectorAll('entry'));
  return entries.map(entry => {
    const linkEl = entry.querySelector('link[rel="alternate"]') || entry.querySelector('link');
    const url = linkEl?.getAttribute('href') || null;

    let img = null;
    const enc = entry.querySelector('link[rel="enclosure"]');
    if (enc) img = enc.getAttribute('href');
    if (!img) {
      const med = entry.querySelector('content[url], thumbnail[url]');
      if (med) img = med.getAttribute('url');
    }
    if (!img) {
      const content = entry.querySelector('content');
      const m = (content?.textContent || '').match(/https:\/\/live\.staticflickr\.com\/[^\s"'<>]+\.jpg/);
      if (m) img = m[0];
    }
    if (img?.includes('_m.jpg')) img = img.replace('_m.jpg', '_b.jpg');
    if (img?.includes('_n.jpg')) img = img.replace('_n.jpg', '_b.jpg');

    const pub = entry.querySelector('published') || entry.querySelector('updated');
    const date = pub ? pub.textContent.trim().slice(0, 10) : null;
    const titleEl = entry.querySelector('title');
    const title = titleEl?.textContent?.trim() || '';

    return { url, image_url: img, title, date };
  }).filter(p => p.url || p.image_url);
}

function lbSetImg(photo) {
  const wrap = document.getElementById('lbImgWrap');
  if (!photo || !photo.image_url) {
    wrap.innerHTML = `<div class="lb-spinner"></div>`;
    return;
  }
  wrap.innerHTML = `<div class="lb-spinner"></div>`;
  const img = new Image();
  img.onload = () => { wrap.innerHTML = ''; wrap.appendChild(img); };
  img.onerror = () => { wrap.innerHTML = `<div style="color:rgba(255,255,255,.4);font-size:13px;">Image unavailable</div>`; };
  img.src = photo.image_url;
  img.alt = photo.title || '';
  img.style.cssText = 'max-width:100%;max-height:calc(100vh - 220px);object-fit:contain;display:block;border-radius:2px;';
}

function lbUpdateFooter() {
  const total = LB.photos.length;
  const photo = LB.photos[LB.index];

  // Counter
  document.getElementById('lbCounter').textContent = total ? `${LB.index + 1} / ${total}` : '';

  // Arrows
  document.getElementById('lbPrev').toggleAttribute('disabled', LB.index === 0);
  document.getElementById('lbNext').toggleAttribute('disabled', LB.index >= total - 1);

  // Star button
  const starBtn = document.getElementById('lbStarBtn');
  const starLabel = document.getElementById('lbStarLabel');
  if (photo) {
    const key = photoFavKey(photo.url || photo.image_url);
    const faved = FAVS.has(key);
    starBtn.classList.toggle('faved', faved);
    starLabel.textContent = faved ? 'Saved' : 'Add to Favourites';
  }

  // Tags
  lbRenderTags();
}

function lbRenderTags() {
  const photo = LB.photos[LB.index];
  const wrap = document.getElementById('lbTagsWrap');
  if (!photo) { wrap.innerHTML = ''; return; }

  const key = photoFavKey(photo.url || photo.image_url);
  const fav = FAVS.get(key);
  const tags = fav?.tags || [];

  const tagPills = tags.map(t =>
    `<span class="lb-tag">${t}<button class="lb-tag-del" onclick="lbRemoveTag('${t}')" title="Remove tag">×</button></span>`
  ).join('');

  const inputHtml = fav
    ? `<input class="lb-tag-input" id="lbTagInput" placeholder="Add tag…" onkeydown="lbTagKeydown(event)">`
    : '';

  wrap.innerHTML = tagPills + inputHtml;
}

function lbTagKeydown(e) {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    const photo = LB.photos[LB.index];
    if (!photo || !val) return;
    const key = photoFavKey(photo.url || photo.image_url);
    addTagToFav(key, val);
    e.target.value = '';
    lbRenderTags();
  }
}

function lbRemoveTag(tag) {
  const photo = LB.photos[LB.index];
  if (!photo) return;
  const key = photoFavKey(photo.url || photo.image_url);
  removeTagFromFav(key, tag);
  lbRenderTags();
  updateTagFilterBar();
}

function lbToggleStar() {
  const photo = LB.photos[LB.index];
  if (!photo) return;
  const key = photoFavKey(photo.url || photo.image_url);
  const meta = {
    photoUrl: photo.url,
    imageUrl: photo.image_url,
    title: photo.title,
    date: photo.date,
    country: LB.country,
    album: LB.albumName,
    flickrUrl: photo.url,
  };
  toggleFav(key, meta, null);
  lbUpdateFooter();
  // Also update the parent card's star if visible
  document.querySelectorAll('.gcard-fav').forEach(btn => {
    const cardKey = btn.dataset.key;
    if (cardKey) btn.classList.toggle('faved', FAVS.has(cardKey));
  });
}

function lbNav(dir) {
  const newIdx = LB.index + dir;
  if (newIdx < 0 || newIdx >= LB.photos.length) return;
  LB.index = newIdx;
  lbSetImg(LB.photos[LB.index]);
  lbUpdateFooter();
}

function closeLightbox() {
  document.getElementById('lbOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function lbClickOutside(e) {
  if (e.target === document.getElementById('lbOverlay')) closeLightbox();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const overlay = document.getElementById('lbOverlay');
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'Escape')     closeLightbox();
});


function renderAll() {
  if (currentView === 'gallery') renderGallery();
  else render();
}

function setView(v) {
  currentView = v;
  document.getElementById('nav-gallery').classList.toggle('active', v === 'gallery');
  document.getElementById('nav-list').classList.toggle('active', v === 'list');
  document.querySelector('.table-wrap').style.display = v === 'list' ? '' : 'none';
  document.getElementById('galleryWrap').classList.toggle('visible', v === 'gallery');
  document.getElementById('gallerySortWrap').classList.toggle('visible', v === 'gallery');
  document.getElementById('favFilterWrap').classList.toggle('visible', v === 'gallery');
  if (v === 'gallery') { updateTagFilterBar(); renderGallery(); }
  else render();
}

const PLATFORM_LABELS = {flickr:'Flickr', stories:'Story', blog:'Blog', exposure:'Exposure'};

function fmtDateFull(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d||1)} ${months[parseInt(m)-1]} ${y}`;
}

function buildGalleryCards(rows) {
  const cards = [];
  rows.forEach(r => {
    // Non-Flickr platforms: one card each
    ['stories','blog','exposure'].forEach(plat => {
      const p = r[plat];
      const url = p?.latest_url || p?.url || '';
      if (p && url) {
        cards.push({
          country: r.country, type: r.type, platform: plat,
          date: p.date || null, url, image_url: p.image_url || null,
          title: p.title || null, subtitle: p.subtitle || null,
          album: null, date_uploaded: null, date_taken: null,
          flickr_realname: null, count: null,
        });
      }
    });

    // Flickr: prefer pre-scraped archive from data.json, fall back to live-fetched
    if (r.flickrUrl) {
      const nsid = nsidFromFlickrUrl(r.flickrUrl);
      // data.json archive (full, scraper-built)
      const scraped = r.flickr_archive;
      // live-fetched fallback (20-photo feed, available while scraper data is missing)
      const live = nsid && FLICKR_ARCHIVE[nsid];
      const archive = (scraped && scraped.length) ? scraped : live;

      if (archive && archive.length) {
        archive.forEach(entry => {
          cards.push({
            country: r.country, type: r.type, platform: 'flickr',
            date: entry.date, url: entry.url,
            image_url: entry.image_url || null,
            title: entry.title || null, subtitle: null,
            album: entry.album || null,
            date_uploaded: entry.date_uploaded || null,
            date_taken: entry.date_taken || null,
            flickr_realname: r.flickr?.realname || null,
            count: entry.count || null,
          });
        });
      } else if (r.flickr?.latest_url || r.flickr?.url) {
        // Last-resort fallback: single card from data.json while archive loads
        const p = r.flickr;
        cards.push({
          country: r.country, type: r.type, platform: 'flickr',
          date: p.date || null, url: p.latest_url || p.url,
          image_url: p.image_url || null, title: p.title || null,
          subtitle: null, album: p.album || null,
          date_uploaded: p.date_uploaded || null,
          date_taken: p.date_taken || null,
          flickr_realname: r.flickr?.realname || null,
          count: null,
        });
      }
    }
  });
  return cards;
}

// ── Shared card builder ────────────────────────────────────────────────────────
function buildCard(c) {
  const flag = FLAGS[c.country] || '🌐';
  const PLACEHOLDER = `<div class="img-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div>`;

  const flickrPhotoUrl = (c.platform === 'flickr' && !c.image_url && c.url && c.url.match(/flickr\.com\/photos\/[^/]+\/\d+/))
    ? c.url : null;

  const imgHtml = c.image_url
    ? `<img src="${c.image_url}" alt="" loading="lazy" onerror="imgError(this)">`
    : flickrPhotoUrl
      ? `<div class="img-placeholder img-loading"></div>`
      : PLACEHOLDER;

  const EXT = `<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
  const dateStr = fmtDateFull(c.date);

  const key = favKey(c);
  const isCardFaved = isFaved(key);
  // Multi-photo Flickr card = can open lightbox
  const canLightbox = c.platform === 'flickr' && c.count > 1;

  const card = document.createElement(canLightbox ? 'div' : 'a');
  card.className = 'gcard';
  if (!canLightbox) {
    card.href = c.url || '#';
    card.target = '_blank';
    card.rel = 'noopener';
  }

  card.innerHTML = `
    <div class="gcard-img${canLightbox ? ' gcard-img-clickable' : ''}">
      ${imgHtml}
      ${c.platform === 'flickr' ? `<div class="gcard-img-chip"><span class="flickr-dots"><span class="flickr-dot-blue"></span><span class="flickr-dot-pink"></span></span>Flickr${c.count > 1 ? ` <span class="gcard-count">${c.count} photos</span>` : ''}</div>` : ''}
      <button class="gcard-fav${isCardFaved ? ' faved' : ''}" data-key="${key}" title="${isCardFaved ? 'Remove from Favourites' : 'Add to Favourites'}">${STAR_SVG}</button>
      ${canLightbox ? `<div class="gcard-img-browse-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> Browse photos</div>` : ''}
    </div>
    <div class="gcard-body">
      <div class="gcard-meta">
        <div class="gcard-meta-top">
          <span class="gcard-flag">${flag}</span>
          <span class="gcard-country">${c.flickr_realname || c.country}</span>
        </div>
        ${dateStr ? `<span class="gcard-date">${dateStr}</span>` : ''}
      </div>
      <div class="gcard-title-row">
        <span class="gcard-title">${
          c.platform === 'flickr'
            ? (c.album ? c.album : (c.count > 1 ? `${c.count} photos` : (c.title || 'Flickr')))
            : (c.title || PLATFORM_LABELS[c.platform])
        }</span>
        ${canLightbox ? '' : `<span class="gcard-ext">${EXT}</span>`}
      </div>
      ${c.platform === 'exposure' && c.subtitle ? `<span class="gcard-subtitle">${c.subtitle}</span>` : ''}
      ${c.platform !== 'flickr' ? `<span class="gcard-platform">${PLATFORM_LABELS[c.platform]}</span>` : ''}
      ${c.platform === 'flickr' ? `
        <div class="gcard-flickr-meta">
          ${c.album ? `<span class="gcard-album">📂 ${c.album}</span>` : ''}
          ${c.date_taken    ? `<span class="gcard-date-detail">📷 Taken: ${c.date_taken}</span>` : ''}
          ${c.date_uploaded ? `<span class="gcard-date-detail">⬆️ Uploaded: ${fmtDateFull(c.date_uploaded)}</span>` : ''}
        </div>` : ''}
    </div>`;

  // Image area click → open lightbox (multi-photo Flickr cards only)
  if (canLightbox) {
    const imgArea = card.querySelector('.gcard-img');
    imgArea.style.cursor = 'pointer';
    imgArea.addEventListener('click', e => {
      if (e.target.closest('.gcard-fav')) return;
      openLightbox(c);
    });
    // Title row: link to Flickr
    const titleRow = card.querySelector('.gcard-title-row');
    titleRow.style.cursor = 'pointer';
    titleRow.addEventListener('click', () => window.open(c.url, '_blank'));
  }

  // Star button — card-level star (favs the whole card, not an individual photo)
  const favBtn = card.querySelector('.gcard-fav');
  const cardMeta = {
    photoUrl: c.url,
    imageUrl: c.image_url,
    title: c.album || c.title,
    date: c.date,
    country: c.flickr_realname || c.country,
    album: c.album || null,
    flickrUrl: c.url,
    isCard: true,
  };
  favBtn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    toggleFav(key, cardMeta, favBtn);
  });

  // Lazy-load Flickr image via oEmbed
  if (flickrPhotoUrl) {
    const imgWrap = card.querySelector('.gcard-img');
    const oembedUrl = `https://www.flickr.com/services/oembed/?url=${encodeURIComponent(flickrPhotoUrl)}&format=json&maxwidth=600`;
    fetch(oembedUrl)
      .then(r => r.json())
      .then(data => {
        const src = data.url || data.thumbnail_url;
        if (src) {
          const loadingDiv = imgWrap.querySelector('.img-loading');
          if (loadingDiv) loadingDiv.outerHTML = `<img src="${src}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">`;
        } else {
          const loadingDiv = imgWrap.querySelector('.img-loading');
          if (loadingDiv) loadingDiv.outerHTML = PLACEHOLDER;
        }
      })
      .catch(() => {
        const loadingDiv = card.querySelector('.img-loading');
        if (loadingDiv) loadingDiv.outerHTML = PLACEHOLDER;
      });
  }

  return card;
}

function renderGallery() {
  const q       = document.getElementById('q').value.toLowerCase();
  const fS      = document.getElementById('fSection').value;
  const fP      = document.getElementById('fPlatform').value;
  const sortVal = document.getElementById('gallerySort').value;
  const favMode = document.getElementById('favFilter').value; // 'favs' | 'all'

  // Show/hide tag filter bar
  updateTagFilterBar();

  const wrap = document.getElementById('galleryWrap');
  const nodata = document.getElementById('galleryNodata');
  Array.from(wrap.children).forEach(el => { if (!el.id) el.remove(); });
  const existingPager = document.getElementById('galleryPager');
  if (existingPager) existingPager.remove();

  // ── Favs mode: show individual photo favs ────────────────────────────────
  if (favMode === 'favs') {
    // Collect all fav entries, filtering by tag if active
    let favEntries = [...FAVS.values()];
    if (q) favEntries = favEntries.filter(f => (f.country||'').toLowerCase().includes(q) || (f.title||'').toLowerCase().includes(q) || (f.album||'').toLowerCase().includes(q));
    if (activeTag) favEntries = favEntries.filter(f => f.tags?.includes(activeTag));

    // Sort
    favEntries.sort((a, b) => {
      if (sortVal === 'date_desc')    return (b.date||'') < (a.date||'') ? -1 : 1;
      if (sortVal === 'date_asc')     return (a.date||'') < (b.date||'') ? -1 : 1;
      if (sortVal === 'country_asc')  return (a.country||'') < (b.country||'') ? -1 : 1;
      if (sortVal === 'country_desc') return (b.country||'') < (a.country||'') ? -1 : 1;
      return 0;
    });

    if (!favEntries.length) {
      nodata.innerHTML = `<div class="selected-empty"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><p>${activeTag ? `No favourites tagged <strong>${activeTag}</strong>.` : 'No favourites yet.<br>Switch to <strong>All Photos</strong> and star cards or individual photos inside albums.'}</p></div>`;
      nodata.classList.add('visible');
      return;
    }
    nodata.classList.remove('visible');

    const totalCards = favEntries.length;
    const totalPages = Math.ceil(totalCards / CARDS_PER_PAGE);
    galleryPage = Math.max(0, Math.min(galleryPage, totalPages - 1));
    const pageCards = favEntries.slice(galleryPage * CARDS_PER_PAGE, (galleryPage + 1) * CARDS_PER_PAGE);

    pageCards.forEach(f => {
      const card = buildFavCard(f);
      wrap.appendChild(card);
    });

    if (totalPages > 1) {
      const pager = document.createElement('div');
      pager.id = 'galleryPager'; pager.className = 'gallery-pager';
      const prevDis = galleryPage === 0 ? ' disabled' : '';
      const nextDis = galleryPage >= totalPages - 1 ? ' disabled' : '';
      pager.innerHTML = `
        <button class="pager-btn"${prevDis} onclick="galleryPage=Math.max(0,galleryPage-1);renderGallery()">← Prev</button>
        <span class="pager-info">Page ${galleryPage + 1} of ${totalPages} &nbsp;·&nbsp; ${totalCards} cards</span>
        <button class="pager-btn"${nextDis} onclick="galleryPage=Math.min(${totalPages-1},galleryPage+1);renderGallery()">Next →</button>`;
      wrap.after(pager);
    }
    return;
  }

  // ── All Photos mode ───────────────────────────────────────────────────────
  let rows = DATA.filter(r => {
    if (q  && !r.country.toLowerCase().includes(q)) return false;
    if (fS && r.type !== fS)                         return false;
    if (fP === 'stories'  && !r.storiesUrl)          return false;
    if (fP === 'blog'     && !r.blogUrl)             return false;
    if (fP === 'exposure' && !r.exposureUrl)         return false;
    if (fP === 'flickr'   && !r.flickrUrl)           return false;
    return true;
  });

  let cards = buildGalleryCards(rows);
  if (fP) cards = cards.filter(c => c.platform === fP);

  cards.sort((a, b) => {
    if (sortVal === 'date_desc')    return (b.date||'') < (a.date||'') ? -1 : 1;
    if (sortVal === 'date_asc')     return (a.date||'') < (b.date||'') ? -1 : 1;
    if (sortVal === 'country_asc')  return a.country < b.country ? -1 : 1;
    if (sortVal === 'country_desc') return b.country < a.country ? -1 : 1;
    return 0;
  });

  const totalCards = cards.length;
  const totalPages = Math.ceil(totalCards / CARDS_PER_PAGE);
  galleryPage = Math.max(0, Math.min(galleryPage, totalPages - 1));
  const pageStart = galleryPage * CARDS_PER_PAGE;
  const paginated = cards.slice(pageStart, pageStart + CARDS_PER_PAGE);

  if (!totalCards) {
    nodata.innerHTML = 'No results match your filters.';
    nodata.classList.add('visible');
    return;
  }
  nodata.classList.remove('visible');

  paginated.forEach(c => wrap.appendChild(buildCard(c)));

  if (totalPages > 1) {
    const pager = document.createElement('div');
    pager.id = 'galleryPager'; pager.className = 'gallery-pager';
    const prevDis = galleryPage === 0 ? ' disabled' : '';
    const nextDis = galleryPage >= totalPages - 1 ? ' disabled' : '';
    pager.innerHTML = `
      <button class="pager-btn"${prevDis} onclick="galleryPage=Math.max(0,galleryPage-1);renderGallery();window.scrollTo({top:document.getElementById('galleryWrap').offsetTop-80,behavior:'smooth'})">← Prev</button>
      <span class="pager-info">Page ${galleryPage + 1} of ${totalPages} &nbsp;·&nbsp; ${totalCards} cards</span>
      <button class="pager-btn"${nextDis} onclick="galleryPage=Math.min(${totalPages-1},galleryPage+1);renderGallery();window.scrollTo({top:document.getElementById('galleryWrap').offsetTop-80,behavior:'smooth'})">Next →</button>`;
    wrap.after(pager);
  }
}

// ── Client-side Exposure.co story fetcher ─────────────────────────────────
// Strategy 1: sitemap.xml (static file, CORS-accessible, has story URLs + dates)
// Strategy 2: Direct fetch of the profile page (works if Exposure sends CORS headers)
// Strategy 3: allorigins CORS proxy as last resort

function exposureOriginFromUrl(url) {
  try { return new URL(url).origin; } catch(e) { return null; }
}

async function fetchExposureStory(profileUrl) {
  const origin = exposureOriginFromUrl(profileUrl);
  if (!origin) return null;

  // Strategy 1: sitemap.xml — Exposure generates one, it's a static XML with story URLs & lastmod dates
  try {
    const r = await fetch(`${origin}/sitemap.xml`, { signal: AbortSignal.timeout(8000) });
    console.log(`[Exposure] sitemap.xml status for ${origin}:`, r.status, r.ok);
    if (r.ok) {
      const xml = await r.text();
      console.log(`[Exposure] sitemap.xml length:`, xml.length, xml.slice(0, 200));
      const result = await parseExposureSitemap(xml, origin, profileUrl);
      console.log(`[Exposure] sitemap parse result:`, result);
      if (result) return result;
    }
  } catch(e) { console.log(`[Exposure] sitemap fetch error:`, e.message); }

  // Strategy 2: Direct fetch of the profile page HTML (Exposure does SSR with OG tags)
  try {
    const r = await fetch(profileUrl, { signal: AbortSignal.timeout(10000) });
    if (r.ok) {
      const html = await r.text();
      const result = parseExposureHtml(html, origin);
      if (result) return result;
    }
  } catch(e) {}

  // Strategy 3: Fetch the most recent story page directly by constructing URL from sitemap slug
  // (already covered by sitemap strategy above)

  return null;
}

async function parseExposureSitemap(xml, origin, profileUrl) {
  // Sitemap entries look like:
  // <url><loc>https://undpafghanistan.exposure.co/a-growing-business</loc><lastmod>2026-04-01</lastmod></url>
  // The profile root and /categories/* are non-story pages — skip those
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'application/xml');
  const urls = Array.from(doc.querySelectorAll('url'));
  
  const stories = [];
  for (const u of urls) {
    const loc = u.querySelector('loc')?.textContent?.trim() || '';
    const lastmod = u.querySelector('lastmod')?.textContent?.trim() || '';
    // Skip root, /categories/*, and any URL with no path segment beyond /
    try {
      const parsed = new URL(loc);
      const path = parsed.pathname;
      if (path === '/' || path === '' || path.startsWith('/categories') || path.startsWith('/api')) continue;
      // Must be same origin
      if (parsed.origin !== origin) continue;
      const m = lastmod.match(/^(\d{4}-\d{2}-\d{2})/);
      stories.push({ loc, date: m ? m[1] : null, slug: path.replace(/^\//, '') });
    } catch(e) { continue; }
  }

  if (!stories.length) return null;

  // Sort by date descending, pick most recent
  stories.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const latest = stories[0];

  // Now fetch that story page for its OG title/image/description
  return await fetchExposureStoryPage(latest.loc, latest.date, origin);
}

async function fetchExposureStoryPage(storyUrl, date, origin) {
  try {
    const r = await fetch(storyUrl, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return { date, url: storyUrl, image_url: null, title: null, subtitle: null };
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const title    = doc.querySelector('meta[property="og:title"]')?.content?.trim()
                  || doc.querySelector('title')?.textContent?.trim() || null;
    const image_url = doc.querySelector('meta[property="og:image"]')?.content?.trim() || null;
    const subtitle  = doc.querySelector('meta[property="og:description"]')?.content?.trim()
                  || doc.querySelector('meta[name="description"]')?.content?.trim() || null;
    return { date, url: storyUrl, image_url, title, subtitle };
  } catch(e) {
    return { date, url: storyUrl, image_url: null, title: null, subtitle: null };
  }
}

function parseExposureHtml(html, origin) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Look for story links in the page — Exposure profile pages list stories as <a href="/slug">
  // with OG or JSON-LD data for the first/featured one
  const ogTitle  = doc.querySelector('meta[property="og:title"]')?.content?.trim() || null;
  const ogImg    = doc.querySelector('meta[property="og:image"]')?.content?.trim() || null;
  const ogDesc   = doc.querySelector('meta[property="og:description"]')?.content?.trim() || null;
  const ogUrl    = doc.querySelector('meta[property="og:url"]')?.content?.trim() || null;

  // Try to find a date in the page
  let date = null;
  const timeEl = doc.querySelector('time[datetime]');
  if (timeEl) {
    const m = timeEl.getAttribute('datetime').match(/^(\d{4}-\d{2}-\d{2})/);
    if (m) date = m[1];
  }
  if (!date) {
    const months = 'january|february|march|april|may|june|july|august|september|october|november|december';
    const bodyText = doc.body?.textContent || '';
    const monthMap = {january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',
      july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
    const dm = bodyText.match(new RegExp(`(${months})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})`, 'i'));
    if (dm) date = `${dm[3]}-${monthMap[dm[1].toLowerCase()]}-${dm[2].padStart(2,'0')}`;
  }

  // Find the most recent story link
  let storyUrl = ogUrl || origin;
  for (const a of doc.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('/') && href.length > 2 && !href.startsWith('/categories') && !href.includes('.')) {
      storyUrl = origin + href;
      break;
    }
  }

  if (ogTitle || ogImg) return { date, url: storyUrl, image_url: ogImg, title: ogTitle, subtitle: ogDesc };
  return null;
}

async function fetchAllExposureStories() {
  const CONCURRENCY = 4;
  // Get all unique offices that have an exposure URL and no data yet
  const offices = DATA.filter(o => o.exposure?.url && !o.exposure?.title && !o.exposure?.date);
  // Deduplicate by URL
  const seen = new Set();
  const unique = offices.filter(o => {
    const u = o.exposure.url;
    if (seen.has(u)) return false;
    seen.add(u); return true;
  });

  console.log(`[Exposure] Fetching ${unique.length} offices:`, unique.map(o => o.exposure.url));

  async function processOne(office) {
    console.log(`[Exposure] Fetching: ${office.exposure.url}`);
    const result = await fetchExposureStory(office.exposure.url);
    console.log(`[Exposure] Result for ${office.country}:`, result);
    if (!result) return;
    // Patch all DATA entries sharing the same exposure URL
    DATA.forEach(o => {
      if (o.exposure?.url === office.exposure.url) {
        o.exposure.date      = result.date      || o.exposure.date;
        o.exposure.title     = result.title     || o.exposure.title;
        o.exposure.subtitle  = result.subtitle  || o.exposure.subtitle;
        o.exposure.image_url = result.image_url || o.exposure.image_url;
        o.exposure.latest_url = result.url      || o.exposure.latest_url;
      }
    });
  }

  for (let i = 0; i < unique.length; i += CONCURRENCY) {
    await Promise.all(unique.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}

// ── Flickr full archive fetcher ───────────────────────────────────────────
// Fetches photos from the public Atom feed (up to 500 via multiple pages),
// then groups them:
//   • Photos in the same album → 1 card (keyed by album title, most-recent date, first image)
//   • Photos with no album on the same date → 1 card per date

async function fetchFlickrFeedPage(nsid, page) {
  const feedUrl = `https://www.flickr.com/services/feeds/photos_public.gne?id=${encodeURIComponent(nsid)}&format=atom&count=500`;
  try {
    const r = await proxiedFetch(feedUrl, 12000);
    if (!r) return [];
    const text = await r.text();
    return parseFlickrAtom(text);
  } catch(e) {
    return [];
  }
}

function parseFlickrAtom(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const entries = Array.from(doc.querySelectorAll('entry'));
  const photos = [];

  for (const entry of entries) {
    // Date (published = upload date)
    const pubEl = entry.querySelector('published') || entry.querySelector('updated');
    const isoDate = pubEl ? pubEl.textContent.trim().slice(0, 10) : null;

    // Photo page URL
    const linkEl = entry.querySelector('link[rel="alternate"]') || entry.querySelector('link');
    const url = linkEl?.getAttribute('href') || null;

    // Image URL
    let img = null;
    const enclosure = entry.querySelector('link[rel="enclosure"]');
    if (enclosure) img = enclosure.getAttribute('href');
    if (!img) {
      const media = entry.querySelector('content[url], thumbnail[url]');
      if (media) img = media.getAttribute('url');
    }
    if (!img) {
      // Regex fallback inside the entry's content
      const contentEl = entry.querySelector('content');
      const raw = contentEl?.textContent || '';
      const m = raw.match(/https:\/\/live\.staticflickr\.com\/[^\s"'<>]+\.jpg/);
      if (m) img = m[0];
    }
    if (img && img.includes('_m.jpg')) img = img.replace('_m.jpg', '_b.jpg');
    if (img && img.includes('_n.jpg')) img = img.replace('_n.jpg', '_b.jpg');

    // Title
    const titleEl = entry.querySelector('title');
    const title = titleEl?.textContent?.trim() || null;

    // Albums: Flickr Atom feeds expose set membership as <category> elements
    // with scheme="https://www.flickr.com/services/feeds/photos_public.gne?id=...&set=..."
    // or as plain category tags whose term looks like a set ID or label.
    // We extract the human-readable label from category elements that have a "label" attribute
    // and whose scheme contains "set=" or "pool=" — those are the album/set entries.
    let album = null;
    const cats = Array.from(entry.querySelectorAll('category'));
    for (const cat of cats) {
      const scheme = cat.getAttribute('scheme') || '';
      const label  = cat.getAttribute('label')  || '';
      const term   = cat.getAttribute('term')   || '';
      // Sets look like scheme contains "set=" or label is a non-tag human string
      if (scheme.includes('set=') || scheme.includes('photosets')) {
        album = label || term || null;
        break;
      }
    }

    if (isoDate) {
      photos.push({ date: isoDate, url, image_url: img, title, album });
    }
  }
  return photos;
}

async function fetchFlickrDateArchive(nsid) {
  try {
    const photos = await fetchFlickrFeedPage(nsid, 1);
    if (!photos.length) return [];
    return groupFlickrPhotos(photos);
  } catch(e) {
    return [];
  }
}

function groupFlickrPhotos(photos) {
  // Two buckets:
  //   byAlbum[albumTitle] = { date (most recent), url (first photo), image_url (first photo), count, album, title }
  //   byDate[YYYY-MM-DD]  = { date, url, image_url, count, album:null, title }
  const byAlbum = {};
  const byDate  = {};

  for (const p of photos) {
    if (p.album) {
      if (!byAlbum[p.album]) {
        // First photo seen for this album — record image & url from it
        byAlbum[p.album] = {
          date: p.date,
          url: p.url,
          image_url: p.image_url,
          title: p.album,       // album name is the title
          album: p.album,
          date_uploaded: p.date, // most recent upload date (updated below)
          date_taken: p.date_taken || null,
          count: 0,
        };
      } else {
        // Keep the most-recent date
        if (p.date > byAlbum[p.album].date) {
          byAlbum[p.album].date = p.date;
          byAlbum[p.album].date_uploaded = p.date;
          // Swap cover image to the newest photo
          if (p.image_url) byAlbum[p.album].image_url = p.image_url;
          if (p.url) byAlbum[p.album].url = p.url;
        }
      }
      byAlbum[p.album].count++;
    } else {
      if (!byDate[p.date]) {
        byDate[p.date] = {
          date: p.date,
          url: p.url,
          image_url: p.image_url,
          title: p.title,
          album: null,
          date_uploaded: p.date,
          date_taken: p.date_taken || null,
          count: 0,
        };
      }
      byDate[p.date].count++;
    }
  }

  const results = [
    ...Object.values(byAlbum),
    ...Object.values(byDate),
  ];

  return results.sort((a, b) => b.date.localeCompare(a.date));
}

async function fetchAllFlickrArchives() {
  const CONCURRENCY = 6;
  // Collect unique NSIDs across all offices that have a Flickr URL
  const seen = new Set();
  const toFetch = [];
  DATA.forEach(o => {
    if (!o.flickrUrl) return;
    const nsid = nsidFromFlickrUrl(o.flickrUrl);
    if (!nsid || seen.has(nsid)) return;
    seen.add(nsid);
    toFetch.push({ nsid, offices: DATA.filter(x => nsidFromFlickrUrl(x.flickrUrl) === nsid) });
  });

  async function processOne({ nsid }) {
    // Skip if already fetched
    if (FLICKR_ARCHIVE[nsid]) return;
    // Resolve vanity → numeric first (feed API needs numeric NSID)
    // We can try both — the feed accepts vanity names too for many accounts
    const entries = await fetchFlickrDateArchive(nsid);
    if (entries.length) FLICKR_ARCHIVE[nsid] = entries;
  }

  for (let i = 0; i < toFetch.length; i += CONCURRENCY) {
    await Promise.all(toFetch.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}

// Extract the vanity name / numeric NSID from a Flickr URL
function nsidFromFlickrUrl(url) {
  const m = url && url.match(/flickr\.com\/(?:people|photos)\/([^/?#]+)/);
  return m ? m[1].replace(/\/$/, '') : null;
}

// Fetch the Flickr account's display name from its public Atom feed.
// The feed is CORS-accessible and includes <author><name>…</name></author>.
async function fetchFlickrRealname(nsid) {
  const feedUrl = `https://www.flickr.com/services/feeds/photos_public.gne?id=${encodeURIComponent(nsid)}&format=atom`;
  try {
    const r = await proxiedFetch(feedUrl, 8000);
    if (!r) return null;
    const text = await r.text();
    // Parse the Atom XML — grab the feed-level <author><name>
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'application/xml');
    // Feed-level author is the first <author> that is a direct child of the root
    const feedAuthor = doc.documentElement.querySelector(':scope > author > name')
                    || doc.querySelector('feed > author > name')
                    || doc.querySelector('author > name');
    const name = feedAuthor?.textContent?.trim();
    return name || null;
  } catch (e) {
    return null;
  }
}

// After initial render, fetch Flickr realnames in the background and patch DATA
async function fetchAllFlickrRealnames() {
  const CONCURRENCY = 6;
  const offices = DATA; // array of merged office objects
  const queue = offices.filter(o => o.flickr?.url && !o.flickr?.realname);

  async function processOne(office) {
    const nsid = nsidFromFlickrUrl(office.flickr.url);
    if (!nsid) return;
    const name = await fetchFlickrRealname(nsid);
    if (name) {
      office.flickr.realname = name;
    }
  }

  // Run in batches for concurrency control
  for (let i = 0; i < queue.length; i += CONCURRENCY) {
    await Promise.all(queue.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}
