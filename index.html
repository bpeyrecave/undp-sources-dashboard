<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNDP Photo &amp; Story Sources</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@undp/design-system-assets@latest/css/components.min.css">
<style>
:root {
  --undp-blue:#006EB5;--undp-blue-dark:#004F85;--undp-red:#EE402D;
  --undp-black:#232E3D;--undp-gray-dark:#55606E;--undp-gray-mid:#A9B1B7;
  --undp-gray-light:#EDEFF0;--undp-white:#FFFFFF;
  --font:proxima-nova,'Proxima Nova',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;background:var(--undp-gray-light);color:var(--undp-black);line-height:1.5}
a{color:var(--undp-blue);text-decoration:none}
a:hover{text-decoration:underline;color:var(--undp-blue-dark)}

header{background:var(--undp-blue);color:#fff;padding:0 32px;display:flex;align-items:stretch;border-bottom:4px solid var(--undp-red)}
.hlogo{display:flex;align-items:center;padding:14px 24px 14px 0;border-right:1px solid rgba(255,255,255,.25);margin-right:24px;font-size:28px;font-weight:900;letter-spacing:2px;color:#fff}
.htitle{display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.htitle h1{font-size:17px;font-weight:700;letter-spacing:.01em}
.htitle p{font-size:11px;opacity:.75;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.hmeta{margin-left:auto;display:flex;align-items:center;font-size:11px;opacity:.7}

.legend{display:flex;gap:20px;padding:8px 32px;background:#fff;border-bottom:1px solid var(--undp-gray-light);font-size:11px;color:var(--undp-gray-dark);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.controls{background:#fff;border-bottom:1px solid var(--undp-gray-mid);padding:10px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls input,.controls select{border:1px solid var(--undp-gray-mid);border-radius:0;padding:6px 10px;font-size:13px;font-family:var(--font);color:var(--undp-black);background:#fff;outline:none}
.controls input:focus,.controls select:focus{border-color:var(--undp-blue)}
.controls input{width:200px}
.count{margin-left:auto;font-size:11px;color:var(--undp-gray-dark)}

.table-wrap{padding:24px 32px 48px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;min-width:780px}
thead tr{background:var(--undp-black)}
th{padding:9px 14px;text-align:left;font-weight:700;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;cursor:pointer;user-select:none;border-right:1px solid rgba(255,255,255,.1)}
th:last-child{border-right:none}
th:hover{background:var(--undp-blue-dark)}
th .si{color:rgba(255,255,255,.35);margin-left:3px;font-size:10px}
td{padding:9px 14px;border-bottom:1px solid var(--undp-gray-light);border-right:1px solid var(--undp-gray-light);vertical-align:middle}
td:last-child{border-right:none}
tr:hover td{background:#F0F6FB}
.cname{font-weight:600;font-size:13px;white-space:nowrap}

tr.sec-hdr td{background:var(--undp-blue);color:#fff;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:5px 14px;border:none}
tr.sec-div td{padding:0;height:4px;background:var(--undp-red);border:none}

.dl{display:inline-block;font-size:12px;font-weight:600;white-space:nowrap}
.dl.fresh{color:#1A6B2A}.dl.mid{color:#8B5E00}.dl.old{color:var(--undp-red)}.dl.visit{color:var(--undp-blue)}
.nodt{color:var(--undp-gray-mid);font-size:12px}
.nodata-row td{text-align:center;padding:40px;color:var(--undp-gray-dark);font-style:italic}
</style>
</head>
<body>

<header>
  <div class="hlogo">UNDP</div>
  <div class="htitle">
    <h1>Photo &amp; Story Sources</h1>
    <p>Country Offices · Regional Bureaux · Thematic Accounts</p>
  </div>
  <div class="hmeta" id="updated"></div>
</header>

<div class="legend">
  <span><span class="dot" style="background:#1A6B2A"></span>Within 3 months</span>
  <span><span class="dot" style="background:#8B5E00"></span>3–12 months ago</span>
  <span><span class="dot" style="background:#EE402D"></span>Over 1 year ago</span>
  <span><span class="dot" style="background:#A9B1B7"></span>No date available</span>
</div>

<div class="controls">
  <input type="text" id="q" placeholder="Search office…" oninput="render()">
  <select id="fSection" onchange="render()">
    <option value="">All offices</option>
    <option value="regional">Regional &amp; Thematic only</option>
    <option value="co">Country Offices only</option>
  </select>
  <select id="fPlatform" onchange="render()">
    <option value="">All platforms</option>
    <option value="stories">Has Stories page</option>
    <option value="blog">Has Blog page</option>
    <option value="exposure">Has Exposure</option>
    <option value="flickr">Has Flickr</option>
  </select>
  <span class="count" id="countLabel"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sort('country')" style="width:190px">Office / Area<span class="si" id="s-country">↕</span></th>
        <th onclick="sort('stories_date')">Stories<span class="si" id="s-stories_date">↕</span></th>
        <th onclick="sort('blog_date')">Blog<span class="si" id="s-blog_date">↕</span></th>
        <th onclick="sort('exposure_date')">Exposure<span class="si" id="s-exposure_date">↕</span></th>
        <th onclick="sort('flickr_date')">Flickr<span class="si" id="s-flickr_date">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"><tr class="nodata-row"><td colspan="5">Loading…</td></tr></tbody>
  </table>
</div>

let DATA=[], sortCol='country', sortDir=1;

function ageCls(iso){
  if(!iso)return'';
  const m=(Date.now()-new Date(iso))/(1000*60*60*24*30.5);
  return m<3?'fresh':m<12?'mid':'old';
}
function fmt(iso){
  if(!iso)return null;
  const[y,mo,d]=iso.split('-');
  return`${d||'01'}/${mo}/${y}`;
}
function cell(p,fb){
  const url=p?.url||fb||'';
  if(!url)return'<td><span class="nodt">—</span></td>';
  const d=p?.date||null;
  const lu=p?.latest_url||url;
  if(!d)return`<td><a href="${url}" target="_blank" class="dl visit">Visit ↗</a></td>`;
  return`<td><a href="${lu}" target="_blank" class="dl ${ageCls(d)}">${fmt(d)}</a></td>`;
}
function sort(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('.si').forEach(e=>e.textContent='↕');
  const el=document.getElementById('s-'+col);
  if(el)el.textContent=sortDir===1?'↑':'↓';
  render();
}
function merge(meta,json){
  const map={};
  if(json)json.forEach(o=>{map[o.country]=o;});
  return meta.map(m=>{
    const d=map[m.country]||{};
    return{...m,
      flickr:{url:m.flickrUrl,date:d.flickr?.date||null,latest_url:d.flickr?.latest_url||m.flickrUrl},
      exposure:{url:m.exposureUrl,date:d.exposure?.date||null,latest_url:d.exposure?.latest_url||m.exposureUrl},
      stories:{url:m.storiesUrl,date:d.stories?.date||null,latest_url:d.stories?.latest_url||m.storiesUrl},
      blog:{url:m.blogUrl,date:d.blog?.date||null,latest_url:d.blog?.latest_url||m.blogUrl},
    };
  });
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const fS=document.getElementById('fSection').value;
  const fP=document.getElementById('fPlatform').value;
  let rows=DATA.filter(r=>{
    if(q&&!r.country.toLowerCase().includes(q))return false;
    if(fS&&r.type!==fS)return false;
    if(fP==='stories'&&!r.storiesUrl)return false;
    if(fP==='blog'&&!r.blogUrl)return false;
    if(fP==='exposure'&&!r.exposureUrl)return false;
    if(fP==='flickr'&&!r.flickrUrl)return false;
    return true;
  });
  const k=sortCol;
  rows.sort((a,b)=>{
    let va,vb;
    if(k==='country'){va=a.country;vb=b.country;}
    else{const p=k.replace('_date','');va=a[p]?.date||'';vb=b[p]?.date||'';}
    return(va<vb?-1:va>vb?1:0)*sortDir;
  });
  document.getElementById('countLabel').textContent=`${rows.length} of ${DATA.length} offices`;
  const tbody=document.getElementById('tbody');
  const sec=!q&&!fS&&!fP;
  if(!rows.length){tbody.innerHTML='<tr class="nodata-row"><td colspan="5">No results.</td></tr>';return;}
  let html='',last=null;
  rows.forEach(r=>{
    if(sec&&r.type!==last){
      if(last!==null)html+=`<tr class="sec-div"><td colspan="5"></td></tr>`;
      const lbl=r.type==='regional'?'Regional Bureaux, Thematic &amp; Programme Accounts':'Country Offices';
      html+=`<tr class="sec-hdr"><td colspan="5">${lbl}</td></tr>`;
      last=r.type;
    }
    html+=`<tr><td class="cname">${r.country}</td>${cell(r.stories,r.storiesUrl)}${cell(r.blog,r.blogUrl)}${cell(r.exposure,r.exposureUrl)}${cell(r.flickr,r.flickrUrl)}</tr>`;
  });
  tbody.innerHTML=html;
}
fetch('data.json').then(r=>r.json()).then(json=>{
  DATA=merge(META,json.offices);
  const el=document.getElementById('updated');
  if(json.updated&&json.updated!=='seed-data-run-scraper-to-update'){
    const d=new Date(json.updated);
    el.textContent='Updated '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }else{el.textContent='Seed data — run workflow to refresh';}
  render();
}).catch(()=>{DATA=merge(META,null);render();});
