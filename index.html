<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNDP Photo &amp; Story Sources</title>
<style>
:root{
  --navy:#232E3D;--blue:#006EB5;--red:#EE402D;
  --gray-bg:#F5F5F5;--gray-section:#EDEFF0;--gray-mid:#A9B1B7;--gray-dark:#55606E;
  --white:#fff;--black:#000;
  --font:proxima-nova,'Proxima Nova','Arial Nova',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;background:var(--gray-bg);color:var(--navy)}
a{color:inherit;text-decoration:none}

/* ── Header ── */
header{
  background:var(--navy);color:var(--white);
  padding:18px 32px;
  display:flex;align-items:center;justify-content:space-between;
}
header h1{font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
header .logo{font-size:16px;font-weight:900;letter-spacing:.12em}

/* ── Controls ── */
.controls{
  background:var(--white);padding:16px 32px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid #E0E0E0;
}
.search-wrap{position:relative;flex:0 0 260px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-dark);fill:none;stroke-width:2}
.search-wrap input{
  width:100%;border:1.5px solid var(--navy);padding:8px 10px 8px 34px;
  font-size:13px;font-family:var(--font);color:var(--navy);background:var(--white);outline:none;
}
.search-wrap input::placeholder{color:var(--gray-mid)}
.search-wrap input:focus{border-color:var(--blue)}

.filter-select{
  position:relative;flex:0 0 200px;
}
.filter-select select{
  width:100%;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--navy);padding:8px 36px 8px 12px;
  font-size:13px;font-family:var(--font);font-weight:600;
  color:var(--navy);background:var(--white);cursor:pointer;outline:none;
  text-transform:uppercase;letter-spacing:.05em;
}
.filter-select select:focus{border-color:var(--blue)}
.filter-select .chev{
  pointer-events:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;
}
.count{margin-left:auto;font-size:12px;color:var(--gray-dark)}

/* ── Table wrapper ── */
.table-wrap{padding:0 32px 48px;overflow-x:auto}

table{
  width:100%;border-collapse:collapse;background:var(--white);
  font-size:13px;min-width:760px;
  border:1px solid #E0E0E0;
}

/* ── Column headers ── */
thead tr{background:var(--navy)}
th{
  padding:10px 16px;text-align:left;
  font-weight:700;font-size:12px;color:var(--white);
  text-transform:none;letter-spacing:.01em;
  white-space:nowrap;user-select:none;
  border-right:1px solid rgba(255,255,255,.08);
}
th:last-child{border-right:none}
th .th-inner{display:flex;align-items:center;gap:6px;cursor:pointer}
th .th-inner:hover{opacity:.8}
.sort-btn{
  background:none;border:none;cursor:pointer;padding:0;
  display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.sort-btn svg{width:10px;height:10px;fill:rgba(255,255,255,.4)}
.sort-btn.asc svg.up{fill:#fff}
.sort-btn.desc svg.dn{fill:#fff}

/* Chevron sort buttons for date columns */
.az-btn{
  background:none;border:none;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.az-btn svg{
  width:16px;height:16px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:2.5;
  transition:transform .2s, stroke .2s;
}
.az-btn.asc svg{ stroke:#fff; transform:rotate(0deg); }
.az-btn.desc svg{ stroke:#fff; transform:rotate(180deg); }

/* ── Section rows ── */
tr.sec-row td{
  background:var(--gray-section);
  padding:8px 16px;border-bottom:1px solid #E0E0E0;border-top:2px solid #D0D4D8;
}
.sec-inner{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.sec-inner.co{color:var(--blue)}
.sec-inner.regional{color:var(--gray-dark)}
.sec-chevron{
  width:16px;height:16px;flex-shrink:0;transition:transform .2s;
  stroke:currentColor;fill:none;stroke-width:2.5;
}
.sec-chevron.open{transform:rotate(0deg)}
.sec-chevron.closed{transform:rotate(-90deg)}

/* ── Section sort button (A→Z icon) ── */
.sec-sort-btn{
  display:inline-flex;align-items:center;
  margin-left:8px;cursor:pointer;opacity:.55;
  transition:opacity .15s;flex-shrink:0;
}
.sec-sort-btn:hover{opacity:1}
.sec-sort-icon{
  width:18px;height:18px;color:currentColor;
  flex-shrink:0;
}

/* ── Data rows ── */
td{
  padding:11px 16px;border-bottom:1px solid #F0F0F0;
  vertical-align:middle;
}
tr.hidden{display:none}
tr:not(.sec-row):hover td{background:#F7F9FC}
.cname{font-size:13px;font-weight:400;color:var(--navy)}

/* ── Platform cell ── */
.pcell{display:flex;align-items:center;gap:6px;white-space:nowrap}
.date-txt{font-size:13px;color:var(--navy)}
.ext-link{
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ext-link svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2}
.ext-link:hover svg{stroke:#c0301f}

/* "Inexistent" pill */
.inexistent{
  display:inline-flex;align-items:center;gap:5px;
  background:#EDEFF0;border:1px solid #C4C9CE;border-radius:20px;
  padding:3px 10px;font-size:12px;color:var(--gray-dark);
  white-space:nowrap;
}
.inexistent svg{width:10px;height:10px;stroke:var(--gray-dark);fill:none;stroke-width:2.5}

.nodata-row td{text-align:center;padding:48px;color:var(--gray-dark);font-style:italic}

/* ── Header nav ── */
.header-nav{display:flex;align-items:center;gap:12px}
.header-nav-item{
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.5);cursor:pointer;
  padding-bottom:2px;border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s;
}
.header-nav-item:hover{color:rgba(255,255,255,.85)}
.header-nav-item.active{color:#fff;border-bottom-color:#fff}
.header-nav-sep{color:rgba(255,255,255,.25);font-size:13px;user-select:none}

/* ── Gallery sort control ── */
.gallery-sort{
  position:relative;flex:0 0 180px;display:none;
}
.gallery-sort.visible{display:block}
.gallery-sort select{
  width:100%;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--navy);padding:8px 36px 8px 12px;
  font-size:13px;font-family:var(--font);font-weight:600;
  color:var(--navy);background:var(--white);cursor:pointer;outline:none;
  text-transform:uppercase;letter-spacing:.05em;
}
.gallery-sort select:focus{border-color:var(--blue)}
.gallery-sort .chev{
  pointer-events:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;
}

/* ── Gallery grid ── */
.gallery-wrap{
  display:none;padding:24px 32px 48px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}
.gallery-wrap.visible{display:grid}

/* ── Gallery card ── */
.gcard{
  background:var(--white);
  border:1px solid #E0E0E0;
  box-shadow:0 2px 4px rgba(16,24,40,.03);
  display:flex;flex-direction:column;
  transition:box-shadow .15s,transform .15s;
  cursor:pointer;text-decoration:none;color:inherit;
}
.gcard:hover{box-shadow:0 6px 20px rgba(16,24,40,.1);transform:translateY(-2px)}
.gcard-img{
  width:100%;aspect-ratio:16/10;overflow:hidden;
  background:#EDEFF0;flex-shrink:0;position:relative;
}
.gcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.gcard-img .img-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#EDEFF0;
}
.gcard-img .img-loading{
  width:100%;height:100%;
  background:linear-gradient(90deg,#EDEFF0 25%,#E0E3E5 50%,#EDEFF0 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.gcard-img .img-placeholder svg{width:36px;height:36px;stroke:#C4C9CE;fill:none;stroke-width:1}
.gcard-body{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.gcard-meta{display:flex;flex-direction:column;gap:2px}
.gcard-meta-top{display:flex;align-items:center;gap:6px}
.gcard-flag{font-size:14px;line-height:1;flex-shrink:0}
.gcard-country{font-size:11px;font-weight:600;color:#677383;line-height:1.4}
.gcard-date{font-size:11px;font-weight:400;color:#677383;line-height:1.4}
.gcard-title-row{display:flex;gap:8px;align-items:flex-start}
.gcard-title{
  flex:1;font-size:14px;font-weight:600;color:#101828;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.gcard-ext{flex-shrink:0;margin-top:2px;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.gcard-album{font-size:11px;color:var(--gray-dark);font-weight:500;line-height:1.4;}
.gcard-flickr-meta{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.gcard-date-detail{font-size:10px;color:var(--gray-mid);line-height:1.3;}
.gcard-ext svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2}
/* Platform chip overlaid on image (top-left) */
.gcard-img-chip{
  position:absolute;top:10px;left:10px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(4px);
  border-radius:20px;padding:4px 10px 4px 8px;
  font-size:12px;font-weight:600;color:#333;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.flickr-dots{display:inline-flex;gap:3px;align-items:center}
.flickr-dot-blue{width:10px;height:10px;border-radius:50%;background:#0063DC}
.flickr-dot-pink{width:10px;height:10px;border-radius:50%;background:#FF0084}

/* Old bottom chip — keep for non-Flickr platforms */
.gcard-platform{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:400;font-family:var(--font);
  color:#677383;padding:3px 10px;border-radius:20px;
  background:#EDEFF0;box-shadow:0 0.5px 1px rgba(0,0,0,.2);
  align-self:flex-start;white-space:nowrap;
}
.gcard-subtitle{
  display:block;font-size:11px;color:#677383;
  line-height:1.4;margin-top:2px;margin-bottom:4px;
  font-style:italic;
}
.gallery-pager{
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:24px 0 32px;width:100%;
}
.pager-btn{
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--navy);background:#fff;border:1.5px solid #D0D5DD;
  border-radius:8px;padding:8px 18px;cursor:pointer;transition:all .15s;
}
.pager-btn:hover:not([disabled]){background:var(--navy);color:#fff;border-color:var(--navy);}
.pager-btn[disabled]{opacity:.35;cursor:default;}
.pager-info{font-size:12px;color:#677383;font-family:var(--font);}
.gcard-count{
  font-size:10px;font-weight:600;background:rgba(255,255,255,.25);
  border-radius:4px;padding:1px 5px;margin-left:4px;
}
.gallery-nodata{
  display:none;padding:48px;text-align:center;
  color:var(--gray-dark);font-style:italic;font-size:13px;
  grid-column:1/-1;
}
.gallery-nodata.visible{display:block}
</style>
</head>
<body>

<header>
  <div class="header-nav">
    <span class="header-nav-item active" id="nav-gallery" onclick="setView('gallery')" title="Photo Archive">Photo Archive</span>
    <span class="header-nav-sep">|</span>
    <span class="header-nav-item" id="nav-list" onclick="setView('list')" title="Editorial Archive">Editorial Archive</span>
  </div>
  <div class="logo">UNDP</div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    <input type="text" id="q" placeholder="Search Office" oninput="galleryPage=0;currentView==='gallery'?renderGallery():render()">
  </div>

  <div class="filter-select">
    <select id="fSection" onchange="galleryPage=0;currentView==='gallery'?renderGallery():render()">
      <option value="">All Offices</option>
      <option value="co">Country Offices</option>
      <option value="bureau">Regional Bureaux</option>
      <option value="thematic">Thematic &amp; Programme</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#232E3D" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="filter-select">
    <select id="fPlatform" onchange="galleryPage=0;currentView==='gallery'?renderGallery():render()">
      <option value="">All Platforms</option>
      <option value="stories">Has Stories</option>
      <option value="blog">Has Blog</option>
      <option value="exposure">Has Exposure</option>
      <option value="flickr">Has Flickr</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#232E3D" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <div class="gallery-sort" id="gallerySortWrap">
    <select id="gallerySort" onchange="galleryPage=0;renderGallery()">
      <option value="date_desc">Most Recent</option>
      <option value="date_asc">Oldest First</option>
      <option value="country_asc">Country A→Z</option>
      <option value="country_desc">Country Z→A</option>
    </select>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#232E3D" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th style="width:200px"></th>
      <th>
        <div class="th-inner" onclick="sort('stories_date')">
          Stories
          <button class="sort-btn az-btn" id="sb-stories_date">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </th>
      <th>
        <div class="th-inner" onclick="sort('blog_date')">
          Blogs
          <button class="sort-btn az-btn" id="sb-blog_date">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </th>
      <th>
        <div class="th-inner" onclick="sort('exposure_date')">
          Exposure
          <button class="sort-btn az-btn" id="sb-exposure_date">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </th>
      <th>
        <div class="th-inner" onclick="sort('flickr_date')">
          Flickr
          <button class="sort-btn az-btn" id="sb-flickr_date">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr class="nodata-row"><td colspan="5">Loading…</td></tr>
  </tbody>
</table>
</div>

<div class="gallery-wrap" id="galleryWrap">
  <div class="gallery-nodata" id="galleryNodata">No results match your filters.</div>
</div>

<script>

let DATA = [];
let sortCol = 'country', sortDir = 1;
const collapsed = {co: false, bureau: false, thematic: false};
const sectionSort = {co: 1, bureau: 1, thematic: 1}; // 1 = A→Z, -1 = Z→A

function fmt(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-');
  return `${d||'01'}/${m}/${y}`;
}

function platformCell(p, fbUrl) {
  const url  = p?.url   || fbUrl || '';
  const date = p?.date  || null;
  const lu   = p?.latest_url || url;

  if (!url) {
    return `<td><span class="inexistent">${X_ICON} Inexistent</span></td>`;
  }
  const label = fmt(date);
  if (!label) {
    return `<td><div class="pcell"><span class="date-txt">—</span><a href="${url}" target="_blank" class="ext-link">${EXT_ICON}</a></div></td>`;
  }
  return `<td><div class="pcell"><span class="date-txt">${label}</span><a href="${lu}" target="_blank" class="ext-link">${EXT_ICON}</a></div></td>`;
}

function updateSortButtons() {
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.remove('asc','desc');
  });
  const id = 'sb-' + sortCol;
  const btn = document.getElementById(id);
  if (btn) btn.classList.add(sortDir === 1 ? 'asc' : 'desc');
}

function sort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  updateSortButtons();
  render();
}

function toggleSection(type) {
  collapsed[type] = !collapsed[type];
  render();
}

function toggleSectionSort(type, e) {
  e.stopPropagation();
  sectionSort[type] *= -1;
  render();
}

function merge(meta, json) {
  const map = {};
  if (json) json.forEach(o => { map[o.country] = o; });
  return meta.map(m => {
    const d = map[m.country] || {};
    return { ...m,
      flickr:   {url:m.flickrUrl,   date:d.flickr?.date||null,   latest_url:d.flickr?.latest_url||m.flickrUrl,   title:d.flickr?.title||null,   image_url:d.flickr?.image_url||null,   album:d.flickr?.album||null,   date_uploaded:d.flickr?.date_uploaded||null,   date_taken:d.flickr?.date_taken||null,   realname:d.flickr?.realname||null},
      exposure: {url:m.exposureUrl, date:d.exposure?.date||null, latest_url:d.exposure?.latest_url||m.exposureUrl, title:d.exposure?.title||null, subtitle:d.exposure?.subtitle||null, image_url:d.exposure?.image_url||null},
      stories:  {url:m.storiesUrl,  date:d.stories?.date||null,  latest_url:d.stories?.latest_url||m.storiesUrl,  title:d.stories?.title||null,  image_url:d.stories?.image_url||null},
      blog:     {url:m.blogUrl,     date:d.blog?.date||null,     latest_url:d.blog?.latest_url||m.blogUrl,        title:d.blog?.title||null,     image_url:d.blog?.image_url||null},
    };
  });
}

function render() {
  const q   = document.getElementById('q').value.toLowerCase();
  const fS  = document.getElementById('fSection').value;
  const fP  = document.getElementById('fPlatform').value;
  const isFiltering = q || fS || fP;

  let rows = DATA.filter(r => {
    if (q  && !r.country.toLowerCase().includes(q)) return false;
    if (fS && r.type !== fS)                         return false;
    if (fP === 'stories'  && !r.storiesUrl)          return false;
    if (fP === 'blog'     && !r.blogUrl)             return false;
    if (fP === 'exposure' && !r.exposureUrl)         return false;
    if (fP === 'flickr'   && !r.flickrUrl)           return false;
    return true;
  });

  

  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="nodata-row"><td colspan="5">No results match your filters.</td></tr>';
    return;
  }

  // Split rows into sections and sort each independently by country name
  const sections = [
    { type: 'co',       items: rows.filter(r => r.type === 'co') },
    { type: 'bureau',   items: rows.filter(r => r.type === 'bureau') },
    { type: 'thematic', items: rows.filter(r => r.type === 'thematic') },
  ].filter(s => s.items.length > 0);

  sections.forEach(s => {
    const dir = isFiltering ? 1 : sectionSort[s.type];
    s.items.sort((a, b) =>
      (a.country < b.country ? -1 : a.country > b.country ? 1 : 0) * dir
    );
  });

  let html = '';

  sections.forEach(s => {
    if (!isFiltering) {
      const isCollapsed = collapsed[s.type];
      const label = s.type === 'co' ? 'Country Offices'
        : s.type === 'bureau' ? 'Regional Bureaux'
        : 'Thematic &amp; Programme Accounts';
      const cls = s.type === 'co' ? 'co' : 'regional';
      const chevHtml = isCollapsed ? CHEV_CLOSE : CHEV_OPEN;
      const sd = sectionSort[s.type];
      const azLabel = sd === 1 ? 'A→Z' : 'Z→A';
      const sortChev = `<span class="sec-sort-btn" onclick="toggleSectionSort('${s.type}', event)" title="${sd === 1 ? 'A→Z — click for Z→A' : 'Z→A — click for A→Z'}">`
        + `<svg class="sec-sort-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">`
        + `<text x="1" y="8" font-size="6" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">A</text>`
        + `<text x="1" y="16" font-size="6" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">Z</text>`
        + `<polyline points="12,2 12,16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`
        + `<polyline points="${sd === 1 ? '8,12 12,16 16,12' : '8,6 12,2 16,6'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`
        + `</svg></span>`;
      html += `<tr class="sec-row">
        <td colspan="5">
          <div class="sec-inner ${cls}" onclick="toggleSection('${s.type}')">
            ${chevHtml}${label}${sortChev}
          </div>
        </td>
      </tr>`;
    }

    s.items.forEach(r => {
      const hide = (!isFiltering && collapsed[s.type]) ? ' class="hidden"' : '';
      html += `<tr${hide}>
        <td class="cname">${r.flickr?.realname || r.country}</td>
        ${platformCell(r.stories,  r.storiesUrl)}
        ${platformCell(r.blog,     r.blogUrl)}
        ${platformCell(r.exposure, r.exposureUrl)}
        ${platformCell(r.flickr,   r.flickrUrl)}
      </tr>`;
    });
  });

  tbody.innerHTML = html;
  updateSortButtons();
}

function fmtDateFull(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d||1)} ${months[parseInt(m)-1]} ${y}`;
}

function buildGalleryCards(rows) {
  const cards = [];
  rows.forEach(r => {
    // Non-Flickr platforms: one card each
    ['stories','blog','exposure'].forEach(plat => {
      const p = r[plat];
      const url = p?.latest_url || p?.url || '';
      if (p && url) {
        cards.push({
          country: r.country, type: r.type, platform: plat,
          date: p.date || null, url, image_url: p.image_url || null,
          title: p.title || null, subtitle: p.subtitle || null,
          album: null, date_uploaded: null, date_taken: null,
          flickr_realname: null, count: null,
        });
      }
    });

    // Flickr: one card per date-group from archive, fallback to single card
    if (r.flickrUrl) {
      const nsid = nsidFromFlickrUrl(r.flickrUrl);
      const archive = nsid && FLICKR_ARCHIVE[nsid];
      if (archive && archive.length) {
        archive.forEach(entry => {
          cards.push({
            country: r.country, type: r.type, platform: 'flickr',
            date: entry.date, url: entry.url,
            image_url: entry.image_url || null,
            title: entry.title || null, subtitle: null,
            album: entry.album || null,
            date_uploaded: entry.date_uploaded || null,
            date_taken: entry.date_taken || null,
            flickr_realname: r.flickr?.realname || null,
            count: entry.count,
          });
        });
      } else if (r.flickr?.latest_url || r.flickr?.url) {
        // Fallback: single card from data.json while archive loads
        const p = r.flickr;
        cards.push({
          country: r.country, type: r.type, platform: 'flickr',
          date: p.date || null, url: p.latest_url || p.url,
          image_url: p.image_url || null, title: p.title || null,
          subtitle: null, album: p.album || null,
          date_uploaded: p.date_uploaded || null,
          date_taken: p.date_taken || null,
          flickr_realname: r.flickr?.realname || null,
          count: null,
        });
      }
    }
  });
  return cards;
}

function renderGallery() {
  const q   = document.getElementById('q').value.toLowerCase();
  const fS  = document.getElementById('fSection').value;
  const fP  = document.getElementById('fPlatform').value;
  const sortVal = document.getElementById('gallerySort').value;

  let rows = DATA.filter(r => {
    if (q  && !r.country.toLowerCase().includes(q)) return false;
    if (fS && r.type !== fS)                         return false;
    if (fP === 'stories'  && !r.storiesUrl)          return false;
    if (fP === 'blog'     && !r.blogUrl)             return false;
    if (fP === 'exposure' && !r.exposureUrl)         return false;
    if (fP === 'flickr'   && !r.flickrUrl)           return false;
    return true;
  });

  let cards = buildGalleryCards(rows);

  // Apply platform filter to cards too
  if (fP) cards = cards.filter(c => c.platform === fP);

  // Sort
  cards.sort((a, b) => {
    if (sortVal === 'date_desc')    return (b.date||'') < (a.date||'') ? -1 : 1;
    if (sortVal === 'date_asc')     return (a.date||'') < (b.date||'') ? -1 : 1;
    if (sortVal === 'country_asc')  return a.country < b.country ? -1 : 1;
    if (sortVal === 'country_desc') return b.country < a.country ? -1 : 1;
    return 0;
  });

  const totalCards = cards.length;
  const totalPages = Math.ceil(totalCards / CARDS_PER_PAGE);
  // Clamp page to valid range (filters may reduce total)
  galleryPage = Math.max(0, Math.min(galleryPage, totalPages - 1));
  const pageStart = galleryPage * CARDS_PER_PAGE;
  cards = cards.slice(pageStart, pageStart + CARDS_PER_PAGE);

  const wrap = document.getElementById('galleryWrap');
  const nodata = document.getElementById('galleryNodata');

  // Remove old cards and pagination (keep nodata div)
  Array.from(wrap.children).forEach(el => { if (!el.id) el.remove(); });
  const existingPager = document.getElementById('galleryPager');
  if (existingPager) existingPager.remove();

  if (!totalCards) {
    nodata.classList.add('visible');
    return;
  }
  nodata.classList.remove('visible');

  cards.forEach(c => {
    const flag = FLAGS[c.country] || '🌐';
    const PLACEHOLDER = `<div class="img-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div>`;

    // For Flickr cards: derive image from latest_url via oEmbed if image_url missing
    const flickrPhotoUrl = (c.platform === 'flickr' && !c.image_url && c.url && c.url.match(/flickr\.com\/photos\/[^/]+\/\d+/))
      ? c.url : null;

    const imgHtml = c.image_url
      ? `<img src="${c.image_url}" alt="" loading="lazy" onerror="imgError(this)">`
      : flickrPhotoUrl
        ? `<div class="img-placeholder img-loading"></div>`
        : PLACEHOLDER;

    const EXT = `<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
    const dateStr = fmtDateFull(c.date);

    const card = document.createElement('a');
    card.className = 'gcard';
    card.href = c.url || '#';
    card.target = '_blank';
    card.rel = 'noopener';
    card.innerHTML = `
      <div class="gcard-img">
        ${imgHtml}
        ${c.platform === 'flickr' ? `<div class="gcard-img-chip"><span class="flickr-dots"><span class="flickr-dot-blue"></span><span class="flickr-dot-pink"></span></span>Flickr${c.count > 1 ? ` <span class="gcard-count">${c.count} photos</span>` : ''}</div>` : ''}
      </div>
      <div class="gcard-body">
        <div class="gcard-meta">
          <div class="gcard-meta-top">
            <span class="gcard-flag">${flag}</span>
            <span class="gcard-country">${c.flickr_realname || c.country}</span>
          </div>
          ${dateStr ? `<span class="gcard-date">${dateStr}</span>` : ''}
        </div>
        <div class="gcard-title-row">
          <span class="gcard-title">${c.platform === "flickr" && c.title ? "Title: " + c.title : c.title || PLATFORM_LABELS[c.platform]}</span>
          <span class="gcard-ext">${EXT}</span>
        </div>
        ${c.platform === 'exposure' && c.subtitle ? `<span class="gcard-subtitle">${c.subtitle}</span>` : ''}
        ${c.platform !== 'flickr' ? `<span class="gcard-platform">${PLATFORM_LABELS[c.platform]}</span>` : ''}
        ${(c.album || c.date_uploaded || c.date_taken) && c.platform === 'flickr' ? `
          <div class="gcard-flickr-meta">
            ${c.album ? `<span class="gcard-album">📂 Folder: ${c.album}</span>` : ''}
            ${c.date_taken ? `<span class="gcard-date-detail">📷 Taken: ${c.date_taken}</span>` : ''}
            ${c.date_uploaded ? `<span class="gcard-date-detail">⬆️ Uploaded: ${c.date_uploaded}</span>` : ''}
          </div>` : ''}
      </div>`;
    wrap.appendChild(card);

    // Lazy-load Flickr image via oEmbed (when image_url not in data.json yet)
    if (flickrPhotoUrl) {
      const imgWrap = card.querySelector('.gcard-img');
      const oembedUrl = `https://www.flickr.com/services/oembed/?url=${encodeURIComponent(flickrPhotoUrl)}&format=json&maxwidth=600`;
      fetch(oembedUrl)
        .then(r => r.json())
        .then(data => {
          const src = data.url || data.thumbnail_url;
          if (src) {
            imgWrap.innerHTML = `<img src="${src}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">`;
          } else {
            imgWrap.innerHTML = PLACEHOLDER;
          }
        })
        .catch(() => { imgWrap.innerHTML = PLACEHOLDER; });
    }
  });

  // ── Pagination controls ──────────────────────────────────────────────────
  if (totalPages > 1) {
    const pager = document.createElement('div');
    pager.id = 'galleryPager';
    pager.className = 'gallery-pager';
    const prevDis = galleryPage === 0 ? ' disabled' : '';
    const nextDis = galleryPage >= totalPages - 1 ? ' disabled' : '';
    pager.innerHTML = `
      <button class="pager-btn"${prevDis} onclick="galleryPage=Math.max(0,galleryPage-1);renderGallery();window.scrollTo({top:document.getElementById('galleryWrap').offsetTop-80,behavior:'smooth'})">← Prev</button>
      <span class="pager-info">Page ${galleryPage + 1} of ${totalPages} &nbsp;·&nbsp; ${totalCards} cards</span>
      <button class="pager-btn"${nextDis} onclick="galleryPage=Math.min(${totalPages-1},galleryPage+1);renderGallery();window.scrollTo({top:document.getElementById('galleryWrap').offsetTop-80,behavior:'smooth'})">Next →</button>
    `;
    wrap.after(pager);
  }
}

// ── Client-side Exposure.co story fetcher ─────────────────────────────────
// Strategy 1: sitemap.xml (static file, CORS-accessible, has story URLs + dates)
// Strategy 2: Direct fetch of the profile page (works if Exposure sends CORS headers)
// Strategy 3: allorigins CORS proxy as last resort

function exposureOriginFromUrl(url) {
  try { return new URL(url).origin; } catch(e) { return null; }
}

async function fetchExposureStory(profileUrl) {
  const origin = exposureOriginFromUrl(profileUrl);
  if (!origin) return null;

  // Strategy 1: sitemap.xml — Exposure generates one, it's a static XML with story URLs & lastmod dates
  try {
    const r = await fetch(`${origin}/sitemap.xml`, { signal: AbortSignal.timeout(8000) });
    console.log(`[Exposure] sitemap.xml status for ${origin}:`, r.status, r.ok);
    if (r.ok) {
      const xml = await r.text();
      console.log(`[Exposure] sitemap.xml length:`, xml.length, xml.slice(0, 200));
      const result = await parseExposureSitemap(xml, origin, profileUrl);
      console.log(`[Exposure] sitemap parse result:`, result);
      if (result) return result;
    }
  } catch(e) { console.log(`[Exposure] sitemap fetch error:`, e.message); }

  // Strategy 2: Direct fetch of the profile page HTML (Exposure does SSR with OG tags)
  try {
    const r = await fetch(profileUrl, { signal: AbortSignal.timeout(10000) });
    if (r.ok) {
      const html = await r.text();
      const result = parseExposureHtml(html, origin);
      if (result) return result;
    }
  } catch(e) {}

  // Strategy 3: Fetch the most recent story page directly by constructing URL from sitemap slug
  // (already covered by sitemap strategy above)

  return null;
}

async function parseExposureSitemap(xml, origin, profileUrl) {
  // Sitemap entries look like:
  // <url><loc>https://undpafghanistan.exposure.co/a-growing-business</loc><lastmod>2026-04-01</lastmod></url>
  // The profile root and /categories/* are non-story pages — skip those
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'application/xml');
  const urls = Array.from(doc.querySelectorAll('url'));
  
  const stories = [];
  for (const u of urls) {
    const loc = u.querySelector('loc')?.textContent?.trim() || '';
    const lastmod = u.querySelector('lastmod')?.textContent?.trim() || '';
    // Skip root, /categories/*, and any URL with no path segment beyond /
    try {
      const parsed = new URL(loc);
      const path = parsed.pathname;
      if (path === '/' || path === '' || path.startsWith('/categories') || path.startsWith('/api')) continue;
      // Must be same origin
      if (parsed.origin !== origin) continue;
      const m = lastmod.match(/^(\d{4}-\d{2}-\d{2})/);
      stories.push({ loc, date: m ? m[1] : null, slug: path.replace(/^\//, '') });
    } catch(e) { continue; }
  }

  if (!stories.length) return null;

  // Sort by date descending, pick most recent
  stories.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const latest = stories[0];

  // Now fetch that story page for its OG title/image/description
  return await fetchExposureStoryPage(latest.loc, latest.date, origin);
}

async function fetchExposureStoryPage(storyUrl, date, origin) {
  try {
    const r = await fetch(storyUrl, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return { date, url: storyUrl, image_url: null, title: null, subtitle: null };
    const html = await r.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const title    = doc.querySelector('meta[property="og:title"]')?.content?.trim()
                  || doc.querySelector('title')?.textContent?.trim() || null;
    const image_url = doc.querySelector('meta[property="og:image"]')?.content?.trim() || null;
    const subtitle  = doc.querySelector('meta[property="og:description"]')?.content?.trim()
                  || doc.querySelector('meta[name="description"]')?.content?.trim() || null;
    return { date, url: storyUrl, image_url, title, subtitle };
  } catch(e) {
    return { date, url: storyUrl, image_url: null, title: null, subtitle: null };
  }
}

function parseExposureHtml(html, origin) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Look for story links in the page — Exposure profile pages list stories as <a href="/slug">
  // with OG or JSON-LD data for the first/featured one
  const ogTitle  = doc.querySelector('meta[property="og:title"]')?.content?.trim() || null;
  const ogImg    = doc.querySelector('meta[property="og:image"]')?.content?.trim() || null;
  const ogDesc   = doc.querySelector('meta[property="og:description"]')?.content?.trim() || null;
  const ogUrl    = doc.querySelector('meta[property="og:url"]')?.content?.trim() || null;

  // Try to find a date in the page
  let date = null;
  const timeEl = doc.querySelector('time[datetime]');
  if (timeEl) {
    const m = timeEl.getAttribute('datetime').match(/^(\d{4}-\d{2}-\d{2})/);
    if (m) date = m[1];
  }
  if (!date) {
    const months = 'january|february|march|april|may|june|july|august|september|october|november|december';
    const bodyText = doc.body?.textContent || '';
    const monthMap = {january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',
      july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
    const dm = bodyText.match(new RegExp(`(${months})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})`, 'i'));
    if (dm) date = `${dm[3]}-${monthMap[dm[1].toLowerCase()]}-${dm[2].padStart(2,'0')}`;
  }

  // Find the most recent story link
  let storyUrl = ogUrl || origin;
  for (const a of doc.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('/') && href.length > 2 && !href.startsWith('/categories') && !href.includes('.')) {
      storyUrl = origin + href;
      break;
    }
  }

  if (ogTitle || ogImg) return { date, url: storyUrl, image_url: ogImg, title: ogTitle, subtitle: ogDesc };
  return null;
}

async function fetchAllExposureStories() {
  const CONCURRENCY = 4;
  // Get all unique offices that have an exposure URL and no data yet
  const offices = DATA.filter(o => o.exposure?.url && !o.exposure?.title && !o.exposure?.date);
  // Deduplicate by URL
  const seen = new Set();
  const unique = offices.filter(o => {
    const u = o.exposure.url;
    if (seen.has(u)) return false;
    seen.add(u); return true;
  });

  console.log(`[Exposure] Fetching ${unique.length} offices:`, unique.map(o => o.exposure.url));

  async function processOne(office) {
    console.log(`[Exposure] Fetching: ${office.exposure.url}`);
    const result = await fetchExposureStory(office.exposure.url);
    console.log(`[Exposure] Result for ${office.country}:`, result);
    if (!result) return;
    // Patch all DATA entries sharing the same exposure URL
    DATA.forEach(o => {
      if (o.exposure?.url === office.exposure.url) {
        o.exposure.date      = result.date      || o.exposure.date;
        o.exposure.title     = result.title     || o.exposure.title;
        o.exposure.subtitle  = result.subtitle  || o.exposure.subtitle;
        o.exposure.image_url = result.image_url || o.exposure.image_url;
        o.exposure.latest_url = result.url      || o.exposure.latest_url;
      }
    });
  }

  for (let i = 0; i < unique.length; i += CONCURRENCY) {
    await Promise.all(unique.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}

// ── Flickr full archive fetcher ───────────────────────────────────────────
// Fetches up to 50 recent photos per office, groups by upload date → one card per date

async function fetchFlickrDateArchive(nsid) {
  // Flickr public feed supports count up to 50
  const feedUrl = `https://www.flickr.com/services/feeds/photos_public.gne?id=${encodeURIComponent(nsid)}&format=atom&count=50`;
  try {
    const r = await fetch(feedUrl, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return [];
    const text = await r.text();
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    const entries = Array.from(doc.querySelectorAll('entry'));
    if (!entries.length) return [];

    // Group photos by upload date (published date, YYYY-MM-DD)
    const byDate = {};
    for (const entry of entries) {
      const pubEl = entry.querySelector('published') || entry.querySelector('updated');
      if (!pubEl) continue;
      const isoDate = pubEl.textContent.trim().slice(0, 10); // YYYY-MM-DD

      // Photo URL
      const linkEl = entry.querySelector('link[rel="alternate"]') || entry.querySelector('link');
      const url = linkEl?.getAttribute('href') || null;

      // Image URL — try enclosure, then media:content, then regex
      let img = null;
      const enclosure = entry.querySelector('link[rel="enclosure"]');
      if (enclosure) img = enclosure.getAttribute('href');
      if (!img) {
        const media = entry.querySelector('content[url], thumbnail[url]');
        if (media) img = media.getAttribute('url');
      }
      if (!img) {
        const m = text.match(/https:\/\/live\.staticflickr\.com\/[^\s"'<>]+\.jpg/);
        if (m) img = m[0];
      }
      if (img && img.includes('_m.jpg')) img = img.replace('_m.jpg', '_b.jpg');

      const titleEl = entry.querySelector('title');
      const title = titleEl?.textContent?.trim() || null;

      if (!byDate[isoDate]) {
        byDate[isoDate] = { date: isoDate, url, image_url: img, title, count: 0 };
      }
      byDate[isoDate].count++;
      // Keep the first photo's image as representative for the date
    }

    return Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date));
  } catch(e) {
    return [];
  }
}

async function fetchAllFlickrArchives() {
  const CONCURRENCY = 6;
  // Collect unique NSIDs across all offices that have a Flickr URL
  const seen = new Set();
  const toFetch = [];
  DATA.forEach(o => {
    if (!o.flickrUrl) return;
    const nsid = nsidFromFlickrUrl(o.flickrUrl);
    if (!nsid || seen.has(nsid)) return;
    seen.add(nsid);
    toFetch.push({ nsid, offices: DATA.filter(x => nsidFromFlickrUrl(x.flickrUrl) === nsid) });
  });

  async function processOne({ nsid }) {
    // Skip if already fetched
    if (FLICKR_ARCHIVE[nsid]) return;
    // Resolve vanity → numeric first (feed API needs numeric NSID)
    // We can try both — the feed accepts vanity names too for many accounts
    const entries = await fetchFlickrDateArchive(nsid);
    if (entries.length) FLICKR_ARCHIVE[nsid] = entries;
  }

  for (let i = 0; i < toFetch.length; i += CONCURRENCY) {
    await Promise.all(toFetch.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}

// Extract the vanity name / numeric NSID from a Flickr URL
function nsidFromFlickrUrl(url) {
  const m = url && url.match(/flickr\.com\/(?:people|photos)\/([^/?#]+)/);
  return m ? m[1].replace(/\/$/, '') : null;
}

// Fetch the Flickr account's display name from its public Atom feed.
// The feed is CORS-accessible and includes <author><name>…</name></author>.
async function fetchFlickrRealname(nsid) {
  const feedUrl = `https://www.flickr.com/services/feeds/photos_public.gne?id=${encodeURIComponent(nsid)}&format=atom`;
  try {
    const r = await fetch(feedUrl, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return null;
    const text = await r.text();
    // Parse the Atom XML — grab the feed-level <author><name>
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'application/xml');
    // Feed-level author is the first <author> that is a direct child of the root
    const feedAuthor = doc.documentElement.querySelector(':scope > author > name')
                    || doc.querySelector('feed > author > name')
                    || doc.querySelector('author > name');
    const name = feedAuthor?.textContent?.trim();
    return name || null;
  } catch (e) {
    return null;
  }
}

// After initial render, fetch Flickr realnames in the background and patch DATA
async function fetchAllFlickrRealnames() {
  const CONCURRENCY = 6;
  const offices = DATA; // array of merged office objects
  const queue = offices.filter(o => o.flickr?.url && !o.flickr?.realname);

  async function processOne(office) {
    const nsid = nsidFromFlickrUrl(office.flickr.url);
    if (!nsid) return;
    const name = await fetchFlickrRealname(nsid);
    if (name) {
      office.flickr.realname = name;
    }
  }

  // Run in batches for concurrency control
  for (let i = 0; i < queue.length; i += CONCURRENCY) {
    await Promise.all(queue.slice(i, i + CONCURRENCY).map(processOne));
    renderAll();
  }
}

fetch('data.json')
  .then(r => r.json())
  .then(json => {
    DATA = merge(META, json.offices);
    setView('gallery');
    fetchAllExposureStories();
    fetchAllFlickrArchives();
    fetchAllFlickrRealnames();
  })
  .catch(() => {
    DATA = merge(META, null);
    setView('gallery');
    fetchAllExposureStories();
    fetchAllFlickrArchives();
    fetchAllFlickrRealnames();
  });
</script>
